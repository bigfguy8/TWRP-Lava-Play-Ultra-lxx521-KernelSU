name: Build Custom Kernel MT6878

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Kernel repo"
        required: true
        default: "NothingOSS/android_kernel_6.1_nothing_mt6878"
      kernel_branch:
        description: "Branch"
        required: true
        default: "mt6878/Tetris/v"
      ksu_variant:
        description: "KernelSU"
        required: true
        default: "KernelSU-Next"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/share/swift /opt/az \
                      /usr/local/.ghcup /opt/pipx /usr/share/miniconda || true
          sudo apt-get clean
          df -h /

      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex git git-lfs \
            gnupg gperf kmod libelf-dev libssl-dev lz4 lzop \
            python3 python3-pip rsync unzip zip zlib1g-dev \
            libncurses5-dev libncursesw5-dev cpio xz-utils \
            device-tree-compiler

      - name: Get clang 17
        run: |
          sudo mkdir -p /opt/tc/clang-17 && cd /opt/tc/clang-17
          sudo curl -fsSL --retry 3 -o c.tgz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r74/clang-r487747c.tar.gz"
          sudo tar xzf c.tgz && sudo rm c.tgz
          /opt/tc/clang-17/bin/clang --version

      - name: Clone kernel
        run: |
          set -euo pipefail
          R="${{ inputs.kernel_source }}"
          B="${{ inputs.kernel_branch }}"
          URL="https://github.com/$R.git"
          echo ">>> $R @ $B"
          if ! git ls-remote --heads "$URL" "refs/heads/$B" | grep -q "refs/heads/$B"; then
            echo "::error::Branch '$B' not found"
            git ls-remote --heads "$URL" | sed 's|.*refs/heads/|  |'
            exit 1
          fi
          git clone --depth=1 --branch "$B" "$URL" ksrc
          cd ksrc
          echo "HEAD: $(git log -1 --oneline)"
          echo "Makefile: $([ -f Makefile ] && echo YES || echo NO)"
          echo "build.config count: $(ls build.config.* 2>/dev/null | wc -l)"

      - name: Diagnostics
        working-directory: ksrc
        run: |
          set +e
          echo "════════ TOP-LEVEL ════════"
          ls -la | head -30
          echo ""
          echo "════════ build.config.* ════════"
          ls -la build.config.* 2>/dev/null | head -25
          echo ""
          echo "════════ arch/arm64/configs count ════════"
          ls arch/arm64/configs/ 2>/dev/null | wc -l
          echo ""
          echo "════════ MTK/nothing configs ════════"
          ls arch/arm64/configs/ 2>/dev/null | grep -iE "mtk|mt6878|nothing|k6878|tetris|galaga" | head -25
          echo ""
          echo "════════ defconfigs >1KB ════════"
          for f in arch/arm64/configs/*_defconfig; do
            [ -f "$f" ] || continue
            SZ=$(stat -c %s "$f")
            [ "$SZ" -gt 1000 ] && echo "  $SZ  $(basename $f)"
          done | head -25
          echo "════════════════════════════════"

      - name: Integrate KernelSU
        if: inputs.ksu_variant != 'none'
        working-directory: ksrc
        run: |
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          echo "KSU: $(cd KernelSU && git rev-parse HEAD)"

      - name: Configure
        working-directory: ksrc
        run: |
          set -euo pipefail
          [ -f Makefile ] || { echo "::error::No Makefile"; exit 1; }
          export PATH=/opt/tc/clang-17/bin:$PATH
          export ARCH=arm64 SUBARCH=arm64 CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
          export READELF=llvm-readelf STRIP=llvm-strip

          # Pick defconfig — prefer MTK device-specific
          DC=""
          for c in "mt6878_defconfig" "nothing_mt6878_defconfig" "k6878v1_64_defconfig" "mgk_64_k61_defconfig" "gki_defconfig"; do
            [ -f "arch/arm64/configs/$c" ] && { DC="$c"; break; }
          done
          if [ -z "$DC" ]; then
            DC=$(ls arch/arm64/configs/*_defconfig 2>/dev/null | head -1 | xargs basename || true)
          fi
          [ -n "$DC" ] || { echo "::error::No defconfig"; exit 1; }
          echo ">>> Using $DC"

          make O=out ARCH=arm64 "$DC"
          [ -f out/.config ] || { echo "::error::.config not created"; exit 1; }
          echo "✅ .config: $(stat -c %s out/.config) bytes"

          if [ "${{ inputs.ksu_variant }}" != "none" ]; then
            ./scripts/config --file out/.config \
              -e CONFIG_KSU -e CONFIG_KALLSYMS -e CONFIG_KALLSYMS_ALL \
              -e CONFIG_MODULES -d CONFIG_MODULE_SIG -d CONFIG_MODVERSIONS || true
            make O=out ARCH=arm64 olddefconfig
          fi

      - name: Build
        working-directory: ksrc
        run: |
          set -euo pipefail
          export PATH=/opt/tc/clang-17/bin:$PATH
          export ARCH=arm64 SUBARCH=arm64 CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
          export READELF=llvm-readelf STRIP=llvm-strip

          JOBS=$(nproc); [ "$JOBS" -gt 4 ] && JOBS=4
          echo "Building -j$JOBS"
          make O=out ARCH=arm64 -j"$JOBS" Image

          [ -f out/arch/arm64/boot/Image ] || { echo "::error::Image missing"; exit 1; }
          echo "✅ Image: $(stat -c %s out/arch/arm64/boot/Image) bytes"

          make O=out ARCH=arm64 -j"$JOBS" dtbs 2>&1 | tail -15 || true
          make O=out ARCH=arm64 -j"$JOBS" modules 2>&1 | tail -20 || true

      - name: Collect
        working-directory: ksrc
        run: |
          set +e
          mkdir -p ../kout
          cp -v out/arch/arm64/boot/Image ../kout/ 2>/dev/null
          cp -v out/arch/arm64/boot/Image.gz ../kout/ 2>/dev/null
          cp -v out/arch/arm64/boot/Image.lz4 ../kout/ 2>/dev/null
          find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} ../kout/ \; 2>/dev/null
          cp -v out/vmlinux ../kout/ 2>/dev/null
          cp -v out/System.map ../kout/ 2>/dev/null
          find out -name "*.ko" -type f 2>/dev/null | head -200 | while read ko; do
            cp "$ko" ../kout/ 2>/dev/null
          done
          ls -lh ../kout/ | head -25

      - name: Verify
        run: |
          set +e
          cd kout
          OK=0
          for f in Image Image.gz Image.lz4 vmlinux; do
            [ -f "$f" ] && { echo "✅ $f: $(stat -c %s "$f")"; OK=1; }
          done
          [ -f Image ] && {
            echo ""
            echo "Kernel: $(strings Image | grep -E 'Linux version 6\.' | head -1)"
            echo "KSU refs: $(strings Image | grep -icE 'kernelsu|ksu_')"
          }
          echo "Modules: $(ls *.ko 2>/dev/null | wc -l)"
          echo "DTBs: $(ls *.dtb 2>/dev/null | wc -l)"
          [ "$OK" = "1" ] && echo "✅ KERNEL BUILT" || { echo "❌ NO KERNEL"; exit 1; }

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-lxx521-${{ github.run_number }}
          path: kout/
          if-no-files-found: warn
          retention-days: 30
