name: Build Custom Kernel (MT6878 / lxx521)

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Kernel source"
        required: true
        default: "mt6878-devs/android_kernel_device_modules"
      kernel_branch:
        description: "Branch"
        required: true
        default: "lineage-23.2"
      ksu_variant:
        description: "KernelSU variant"
        required: true
        default: "KernelSU-Next"
        type: choice
        options:
          - "KernelSU-Next"
          - "SukiSU-Ultra"
          - "none"
      defconfig:
        description: "Defconfig (empty = auto)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Maximize disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/share/swift /opt/az \
                      /usr/local/.ghcup /opt/pipx /usr/share/miniconda
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          sudo swapoff -a || true
          df -h /

      - name: Install host deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex git git-lfs \
            gnupg gperf kmod libelf-dev libssl-dev lz4 lzop \
            python3 python3-pip rsync unzip zip zlib1g-dev \
            libncurses5-dev libncursesw5-dev cpio xz-utils \
            device-tree-compiler android-sdk-libsparse-utils

      - name: Install AOSP clang 17
        run: |
          set -e
          sudo mkdir -p /opt/toolchains
          cd /opt/toolchains
          sudo curl -fsSL --retry 3 -o clang.tar.gz \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r74/clang-r487747c.tar.gz
          sudo tar xzf clang.tar.gz
          sudo rm clang.tar.gz
          sudo mv clang-r487747c clang-17
          /opt/toolchains/clang-17/bin/clang --version

      - name: Clone kernel source
        run: |
          set -e
          REPO="${{ inputs.kernel_source }}"
          BRANCH="${{ inputs.kernel_branch }}"
          echo ">>> $REPO (branch: $BRANCH)"
          git clone --depth=1 --branch "$BRANCH" "https://github.com/$REPO.git" kernel-src 2>&1 | tail -3 || \
            git clone --depth=1 "https://github.com/$REPO.git" kernel-src
          cd kernel-src
          echo "HEAD: $(git log -1 --oneline)"
          echo ""
          echo "=== Top-level ==="
          ls -la | head -20
          echo ""
          echo "=== arch/arm64/configs count ==="
          ls arch/arm64/configs/ 2>/dev/null | wc -l
          echo "=== MTK-specific defconfigs ==="
          ls arch/arm64/configs/ 2>/dev/null | grep -iE "k6878|mt6878|lxx521|mtk" | head -20

      - name: Integrate KernelSU
        if: inputs.ksu_variant != 'none'
        working-directory: kernel-src
        run: |
          set -e
          VARIANT="${{ inputs.ksu_variant }}"

          if [ "$VARIANT" = "KernelSU-Next" ]; then
            echo ">>> Cloning KernelSU-Next"
            git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
            cd KernelSU && echo "KSU commit: $(git rev-parse HEAD)" && cd ..
          elif [ "$VARIANT" = "SukiSU-Ultra" ]; then
            echo ">>> Cloning SukiSU-Ultra"
            git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
            cd KernelSU && echo "KSU commit: $(git rev-parse HEAD)" && cd ..
          fi

          ls -la KernelSU/ | head -5

      - name: Find defconfig
        id: finddef
        working-directory: kernel-src
        run: |
          set +e
          DEFCFG="${{ inputs.defconfig }}"

          if [ -n "$DEFCFG" ] && [ -f "arch/arm64/configs/$DEFCFG" ]; then
            echo "Using provided: $DEFCFG"
            echo "name=$DEFCFG" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "=== Auto-detect ==="
          # Priority: lxx521 > k6878 > mt6878 > MTK generic
          for pattern in "lxx521" "k6878" "mt6878" "mt6835" "mtk"; do
            for f in arch/arm64/configs/*${pattern}*defconfig; do
              [ -f "$f" ] || continue
              BN=$(basename "$f")
              echo "  found: $BN"
              echo "name=$BN" >> $GITHUB_OUTPUT
              exit 0
            done
          done

          # GKI fallback
          for f in gki_defconfig k6878v1_64_defconfig; do
            [ -f "arch/arm64/configs/$f" ] && {
              echo "  fallback: $f"
              echo "name=$f" >> $GITHUB_OUTPUT
              exit 0
            }
          done

          echo "  using first available"
          DEFCFG=$(ls arch/arm64/configs/*defconfig 2>/dev/null | head -1 | xargs basename)
          echo "name=$DEFCFG" >> $GITHUB_OUTPUT

      - name: Configure
        working-directory: kernel-src
        run: |
          set -e
          export PATH=/opt/toolchains/clang-17/bin:$PATH
          export ARCH=arm64 SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
          export READELF=llvm-readelf STRIP=llvm-strip

          DEFCFG="${{ steps.finddef.outputs.name }}"
          echo ">>> make O=out $DEFCFG"
          make O=out ARCH=arm64 "$DEFCFG"

          echo ""
          echo "=== Apply KernelSU configs ==="
          ./scripts/config --file out/.config \
            -e CONFIG_KALLSYMS \
            -e CONFIG_KALLSYMS_ALL \
            -e CONFIG_MODULES \
            -e CONFIG_MODULE_UNLOAD \
            -d CONFIG_MODULE_SIG \
            -d CONFIG_MODULE_SIG_ALL \
            -d CONFIG_MODULE_SIG_FORCE \
            -d CONFIG_MODVERSIONS \
            -e CONFIG_KSU 2>/dev/null || true

          if [ "${{ inputs.ksu_variant }}" != "none" ]; then
            ./scripts/config --file out/.config \
              -e CONFIG_KSU \
              -e CONFIG_KSU_MANUAL_HOOK \
              -d CONFIG_KSU_KPROBES_HOOK 2>/dev/null || true
          fi

          make O=out ARCH=arm64 olddefconfig 2>&1 | tail -2

          echo ""
          echo "=== Final check ==="
          grep -E "^CONFIG_(KSU|MODULES|MODULE_SIG|MODVERSIONS|KALLSYMS)" out/.config | head -10

      - name: Build kernel
        working-directory: kernel-src
        run: |
          set -e
          export PATH=/opt/toolchains/clang-17/bin:$PATH
          export ARCH=arm64 SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
          export READELF=llvm-readelf STRIP=llvm-strip

          JOBS=$(nproc)
          [ "$JOBS" -gt 4 ] && JOBS=4
          echo "Building -j$JOBS"

          # Build kernel Image first
          make O=out ARCH=arm64 -j"$JOBS" Image 2>&1 | tail -100

          # Build DTBs
          make O=out ARCH=arm64 -j"$JOBS" dtbs 2>&1 | tail -30 || true

          # Build modules
          make O=out ARCH=arm64 -j"$JOBS" modules 2>&1 | tail -50 || true

          # Build dtbo image if supported
          make O=out ARCH=arm64 -j"$JOBS" dtbo.img 2>&1 | tail -20 || true

      - name: Collect outputs
        working-directory: kernel-src
        run: |
          set +e
          mkdir -p ../kernel-out
          echo "=== Kernel images ==="
          find out/arch/arm64/boot -maxdepth 2 -type f \( \
            -name "Image" -o -name "Image.gz" -o -name "Image.lz4" \
            -o -name "dtb" -o -name "*.dtb" -o -name "dtbo.img" \) \
            -exec cp -v {} ../kernel-out/ \; 2>/dev/null

          echo ""
          echo "=== vmlinux + System.map ==="
          [ -f out/vmlinux ] && cp out/vmlinux ../kernel-out/
          [ -f out/System.map ] && cp out/System.map ../kernel-out/

          echo ""
          echo "=== Modules ==="
          find out -name "*.ko" -type f 2>/dev/null | head -200 | while read ko; do
            cp "$ko" ../kernel-out/ 2>/dev/null
          done

          echo ""
          ls -lh ../kernel-out/ | head -40
          echo ""
          echo "Total files: $(ls ../kernel-out/ | wc -l)"

      - name: Verify + report
        run: |
          set +e
          cd kernel-out
          echo "════════ VERIFY ════════"
          OK=0
          for f in Image Image.gz Image.lz4 vmlinux; do
            if [ -f "$f" ]; then
              echo "✅ $f: $(stat -c %s "$f") bytes"
              file "$f"
              OK=1
            fi
          done

          if [ -f Image ]; then
            echo ""
            echo "=== Kernel version ==="
            strings Image | grep -E "Linux version 6\." | head -1
            echo ""
            echo "=== vermagic ==="
            strings Image | grep -E "vermagic" | head -1 || strings Image | grep -E "^6\.[0-9]+\.[0-9]+" | head -3
            echo ""
            echo "=== KernelSU symbols ==="
            strings Image | grep -icE "kernelsu|ksu_|prctl" || echo 0
          fi

          echo ""
          echo "=== Modules: $(ls *.ko 2>/dev/null | wc -l) ==="
          echo "=== DTBs: $(ls *.dtb 2>/dev/null | wc -l) ==="

          [ "$OK" = "1" ] || { echo "❌ No kernel built"; exit 1; }

      - name: Create release bundle
        run: |
          set -e
          cd kernel-out
          cat > kernel-info.txt << INFO
          Kernel for Lava Play Ultra 5G (lxx521 / MT6878)
          Kernel source: ${{ inputs.kernel_source }} @ ${{ inputs.kernel_branch }}
          KernelSU variant: ${{ inputs.ksu_variant }}
          Build date: $(date -u)
          Commit: ${{ github.sha }}
          INFO
          tar czf ../kernel-lxx521-${{ github.run_number }}.tar.gz .

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-lxx521-${{ github.run_number }}-${{ inputs.ksu_variant }}
          path: |
            kernel-out/
            kernel-lxx521-${{ github.run_number }}.tar.gz
          retention-days: 30
          if-no-files-found: warn
