name: Build Custom Kernel MT6878

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Kernel repo"
        required: true
        default: "mt6878-devs/android_kernel_device_modules"
      kernel_branch:
        description: "Branch"
        required: true
        default: "lineage-23.2"
      build_target:
        description: "Build config target (see diagnostics)"
        required: true
        default: "mtk_kernel_device_modules"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/share/swift /opt/az \
                      /usr/local/.ghcup /opt/pipx /usr/share/miniconda || true
          sudo apt-get clean
          df -h /

      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex git git-lfs \
            gnupg gperf kmod libelf-dev libssl-dev lz4 lzop \
            python3 python3-pip rsync unzip zip zlib1g-dev \
            libncurses5-dev libncursesw5-dev cpio xz-utils \
            device-tree-compiler

      - name: Get clang 17
        run: |
          sudo mkdir -p /opt/tc/clang-17
          cd /opt/tc/clang-17
          sudo curl -fsSL --retry 3 -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r74/clang-r487747c.tar.gz"
          sudo tar xzf clang.tar.gz
          sudo rm clang.tar.gz
          echo "=== clang contents ==="
          ls /opt/tc/clang-17/ | head
          /opt/tc/clang-17/bin/clang --version

      - name: Clone kernel
        run: |
          set -e
          R="${{ inputs.kernel_source }}"
          B="${{ inputs.kernel_branch }}"
          git clone --depth=1 --branch "$B" "https://github.com/$R.git" ksrc 2>&1 | tail -3 || \
            git clone --depth=1 "https://github.com/$R.git" ksrc
          cd ksrc
          echo "HEAD: $(git log -1 --oneline)"

      - name: DIAGNOSTICS
        working-directory: ksrc
        run: |
          set +e
          echo "════════════════════════════════════════"
          echo "  DIAGNOSTICS — what's actually here"
          echo "════════════════════════════════════════"

          echo ""
          echo ">>> Top-level files:"
          ls -la | head -30

          echo ""
          echo ">>> build.config.* files:"
          ls -la build.config.* 2>/dev/null || echo "  NONE"

          echo ""
          echo ">>> build/ directory:"
          ls -la build/ 2>/dev/null || echo "  NO build/ dir"

          echo ""
          echo ">>> arch/arm64/configs (first 40):"
          ls arch/arm64/configs/ 2>/dev/null | head -40 || echo "  NO configs dir"

          echo ""
          echo ">>> configs matching mtk/k6878/mt6878/mgk:"
          ls arch/arm64/configs/ 2>/dev/null | grep -iE "mtk|k6878|mt6878|mgk|lxx" | head -20 || echo "  NONE"

          echo ""
          echo ">>> defconfigs with non-zero size:"
          for f in arch/arm64/configs/*defconfig; do
            [ -f "$f" ] || continue
            SZ=$(stat -c %s "$f")
            [ "$SZ" -gt 100 ] && echo "  $SZ bytes  $(basename $f)"
          done | head -20

          echo ""
          echo ">>> Android.bp / build system markers:"
          ls -la Android.bp Android.mk Makefile 2>/dev/null

          echo "════════════════════════════════════════"

      - name: Try GKI build.sh
        working-directory: ksrc
        run: |
          set +e
          export PATH=/opt/tc/clang-17/bin:$PATH
          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
          export READELF=llvm-readelf STRIP=llvm-strip

          TARGET="${{ inputs.build_target }}"

          if [ -f "build/build.sh" ] && [ -f "build.config.${TARGET}" ]; then
            echo ">>> GKI-style build via build/build.sh"
            echo ">>> BUILD_CONFIG=build.config.${TARGET}"
            BUILD_CONFIG=build.config.${TARGET} build/build.sh 2>&1 | tail -150
            echo "build rc: $?"
          else
            echo ">>> GKI build.sh not found or config missing"
            echo ">>> Trying make-based build"

            for DC in mgk_64_k61_defconfig k6878v1_64_defconfig mt6878_defconfig; do
              [ -f "arch/arm64/configs/$DC" ] || continue
              echo ""
              echo ">>> Trying $DC"
              rm -rf out
              if make O=out ARCH=arm64 "$DC" 2>&1 | tail -3; then
                echo "✅ $DC config OK"
                make O=out ARCH=arm64 -j"$(nproc)" Image 2>&1 | tail -100
                break
              fi
            done
          fi

      - name: Collect
        run: |
          set +e
          mkdir -p kout
          # Search everywhere
          find ksrc -type f \( \
            -name "Image" -o -name "Image.gz" -o -name "Image.lz4" \
            -o -name "vmlinux" -o -name "*.dtb" -o -name "dtbo.img" \
            -o -name "System.map" \) 2>/dev/null | head -50 | while read f; do
            cp "$f" kout/ 2>/dev/null
          done
          find ksrc -name "*.ko" -type f 2>/dev/null | head -100 | while read ko; do
            cp "$ko" kout/ 2>/dev/null
          done
          echo "=== Collected ==="
          ls -lh kout/ 2>/dev/null | head -30

      - name: Verify
        run: |
          set +e
          cd kout 2>/dev/null || { echo "no kout"; exit 1; }
          echo "════════ VERIFY ════════"
          OK=0
          for f in Image Image.gz Image.lz4 vmlinux; do
            [ -f "$f" ] && { echo "✅ $f: $(stat -c %s "$f")"; OK=1; }
          done
          [ -f Image ] && {
            echo ""
            echo "Kernel: $(strings Image | grep -E 'Linux version 6\.' | head -1)"
          }
          echo "Modules: $(ls *.ko 2>/dev/null | wc -l)"
          [ "$OK" = "1" ] && echo "✅ KERNEL BUILT" || echo "⚠️ No Image found"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-lxx521-${{ github.run_number }}
          path: kout/
          if-no-files-found: warn
          retention-days: 30
