name: Build Kernel for Lava Play Ultra 5G (lxx521 / MT6878)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source repo"
        required: true
        default: "mt6878-devs/android_kernel_device_modules"
        type: choice
        options:
          - "mt6878-devs/android_kernel_device_modules"
          - "NothingOSS/android_kernel_6.1_nothing_mt6878"
      kernel_branch:
        description: "Kernel branch"
        required: true
        default: "lineage-23.2"
      defconfig:
        description: "Defconfig name (try k6878v1_64_defconfig if empty)"
        required: false
        default: ""

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Maximize disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/share/swift /opt/az \
                      /usr/local/.ghcup /opt/pipx /usr/share/miniconda
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          df -h /

      - name: Install host deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex git git-lfs \
            gnupg gperf kmod libelf-dev libssl-dev lz4 lzop \
            python3 python3-pip rsync unzip zip zlib1g-dev \
            libncurses5-dev libncursesw5-dev cpio xz-utils \
            device-tree-compiler

      - name: Install AOSP clang 17
        run: |
          set -e
          cd /opt
          sudo mkdir -p toolchains && cd toolchains
          sudo curl -fsSL --retry 3 -o clang.tar.gz \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r74/clang-r487747c.tar.gz
          sudo tar xzf clang.tar.gz
          sudo rm clang.tar.gz
          sudo mv clang-r487747c clang-17
          ls /opt/toolchains/clang-17/bin/ | head
          /opt/toolchains/clang-17/bin/clang --version

      - name: Install build-tools (mkbootimg etc)
        run: |
          set -e
          cd /opt
          sudo git clone --depth=1 https://github.com/LineageOS/android_system_tools_mkbootimg.git 2>/dev/null || true
          cd /opt/android_system_tools_mkbootimg 2>/dev/null || true

      - name: Clone kernel source
        run: |
          set -e
          REPO="${{ inputs.kernel_repo }}"
          BRANCH="${{ inputs.kernel_branch }}"
          echo ">>> Cloning https://github.com/$REPO (branch: $BRANCH)"
          git clone --depth=1 --branch "$BRANCH" "https://github.com/$REPO.git" kernel-src 2>&1 | tail -5 || \
            git clone --depth=1 "https://github.com/$REPO.git" kernel-src
          cd kernel-src
          echo "HEAD: $(git log -1 --oneline)"
          echo ""
          echo "=== Top-level ==="
          ls -la | head -30
          echo ""
          echo "=== arch/arm64/configs exists? ==="
          ls arch/arm64/configs/ 2>/dev/null | head -30 || echo "MISSING (this is not full kernel source)"

      - name: Find defconfig
        id: finddef
        working-directory: kernel-src
        run: |
          set +e
          if [ ! -d arch/arm64/configs ]; then
            echo "::error::Not a full kernel source tree"
            exit 1
          fi

          DEFCFG="${{ inputs.defconfig }}"
          if [ -n "$DEFCFG" ] && [ -f "arch/arm64/configs/$DEFCFG" ]; then
            echo "Using user-provided: $DEFCFG"
            echo "name=$DEFCFG" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "=== Searching for lxx521-specific defconfig ==="
          for f in arch/arm64/configs/*lxx521* arch/arm64/configs/*k6878* arch/arm64/configs/*mt6878*; do
            [ -f "$f" ] || continue
            BN=$(basename "$f")
            echo "  found: $BN"
            echo "name=$BN" >> $GITHUB_OUTPUT
            exit 0
          done

          echo "=== No device-specific defconfig, using generic MTK ==="
          for f in arch/arm64/configs/k6878v1_64_defconfig \
                   arch/arm64/configs/mt6878_defconfig \
                   arch/arm64/configs/mt6878_debug_defconfig \
                   arch/arm64/configs/gki_defconfig; do
            [ -f "$f" ] || continue
            BN=$(basename "$f")
            echo "  using: $BN"
            echo "name=$BN" >> $GITHUB_OUTPUT
            exit 0
          done

          echo "=== Fallback: first available defconfig ==="
          DEFCFG=$(ls arch/arm64/configs/*defconfig 2>/dev/null | head -1 | xargs basename)
          echo "  using: $DEFCFG"
          echo "name=$DEFCFG" >> $GITHUB_OUTPUT

      - name: Show defconfig
        run: |
          echo "Chosen defconfig: ${{ steps.finddef.outputs.name }}"
          head -30 kernel-src/arch/arm64/configs/${{ steps.finddef.outputs.name }} 2>/dev/null || true

      - name: Configure kernel
        working-directory: kernel-src
        run: |
          set -e
          export PATH=/opt/toolchains/clang-17/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip

          rm -rf out
          mkdir -p out

          DEFCFG="${{ steps.finddef.outputs.name }}"
          echo ">>> make O=out $DEFCFG"
          make O=out ARCH=arm64 "$DEFCFG"

          echo ""
          echo "=== Kernel config summary ==="
          grep -E "^CONFIG_(LOCALVERSION|KERNEL_LOCAL_VERSION|MODVERSIONS|MODULES)" out/.config | head -10

      - name: Force KernelSU-friendly configs
        working-directory: kernel-src
        run: |
          set +e
          # Enable options commonly needed
          ./scripts/config --file out/.config \
            -e CONFIG_KALLSYMS \
            -e CONFIG_KALLSYMS_ALL \
            -e CONFIG_MODULES \
            -e CONFIG_MODULE_UNLOAD \
            -d CONFIG_MODULE_SIG \
            -d CONFIG_MODULE_SIG_ALL \
            -d CONFIG_MODULE_SIG_FORCE \
            -d CONFIG_MODVERSIONS \
            -e CONFIG_KSU 2>/dev/null || true
          make O=out ARCH=arm64 olddefconfig 2>&1 | tail -3

      - name: Build kernel
        working-directory: kernel-src
        run: |
          set -e
          export PATH=/opt/toolchains/clang-17/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip

          JOBS=$(nproc)
          echo "Building with -j$JOBS"
          make O=out ARCH=arm64 -j"$JOBS" 2>&1 | tail -200

      - name: Collect outputs
        working-directory: kernel-src
        run: |
          set +e
          mkdir -p ../kernel-output
          echo "=== Searching for kernel binaries ==="

          find out/arch/arm64/boot -maxdepth 2 -type f \( -name "Image" -o -name "Image.gz" -o -name "Image.lz4" -o -name "Image.gz-dtb" -o -name "dtb" -o -name "*.dtb" -o -name "dtbo.img" \) -exec cp -v {} ../kernel-output/ \; 2>/dev/null

          # Modules
          find out -name "*.ko" -type f 2>/dev/null | head -50 | while read ko; do
            cp "$ko" ../kernel-output/ 2>/dev/null
          done

          # vmlinux for debugging
          [ -f out/vmlinux ] && cp -v out/vmlinux ../kernel-output/ 2>/dev/null || true

          # System.map
          [ -f out/System.map ] && cp -v out/System.map ../kernel-output/ 2>/dev/null || true

          echo ""
          echo "=== Collected files ==="
          ls -lh ../kernel-output/

      - name: Verify kernel
        run: |
          set +e
          cd kernel-output
          echo "════════ VERIFY ════════"

          OK=0
          for f in Image Image.gz Image.lz4 vmlinux; do
            if [ -f "$f" ]; then
              echo "✅ $f: $(stat -c %s "$f") bytes"
              file "$f"
              OK=1
            fi
          done

          if [ -f Image ]; then
            echo ""
            echo "=== Kernel version string ==="
            strings Image 2>/dev/null | grep -E "Linux version 6\.1" | head -1
            echo ""
            echo "=== vermagic (for reference) ==="
            strings Image 2>/dev/null | grep -E "^6\.1\.[0-9]+" | head -3
          fi

          echo ""
          echo "=== Modules count ==="
          ls *.ko 2>/dev/null | wc -l

          if [ "$OK" != "1" ]; then
            echo "❌ No kernel binary built"
            exit 1
          fi

      - name: Create tarball
        run: |
          cd kernel-output
          tar czf ../kernel-lxx521-$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7).tar.gz .
          ls -lh ../*.tar.gz

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-lxx521-${{ github.run_number }}
          path: |
            kernel-output/*
            kernel-lxx521-*.tar.gz
          if-no-files-found: warn
          retention-days: 30
