name: Build Custom Kernel MT6878

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        default: "NothingOSS/android_kernel_6.1_nothing_mt6878"
      kernel_branch:
        default: "mt6878/Tetris/v"
      ksu_variant:
        default: "KernelSU-Next"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/share/swift /opt/az \
                      /usr/local/.ghcup /opt/pipx /usr/share/miniconda || true
          sudo apt-get clean

      - name: Deps (with GCC cross)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex git git-lfs \
            gnupg gperf kmod libelf-dev libssl-dev lz4 lzop \
            python3 python3-pip rsync unzip zip zlib1g-dev \
            libncurses5-dev libncursesw5-dev cpio xz-utils \
            device-tree-compiler \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libc6-dev-arm64-cross libc6-dev-armhf-cross
          # verify
          which aarch64-linux-gnu-gcc && aarch64-linux-gnu-gcc --version | head -1
          which arm-linux-gnueabi-gcc && arm-linux-gnueabi-gcc --version | head -1

      - name: Get clang 17
        run: |
          sudo mkdir -p /opt/tc/clang-17 && cd /opt/tc/clang-17
          sudo curl -fsSL --retry 3 -o c.tgz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r74/clang-r487747c.tar.gz"
          sudo tar xzf c.tgz && sudo rm c.tgz
          /opt/tc/clang-17/bin/clang --version

      - name: Clone kernel
        run: |
          set -euo pipefail
          R="${{ inputs.kernel_source }}"
          B="${{ inputs.kernel_branch }}"
          URL="https://github.com/$R.git"
          git ls-remote --heads "$URL" "refs/heads/$B" | grep -q "refs/heads/$B" || {
            echo "::error::Branch '$B' not found"; exit 1; }
          git clone --depth=1 --branch "$B" "$URL" ksrc
          cd ksrc
          echo "Makefile: $([ -f Makefile ] && echo YES || echo NO)"
          echo "build/build.sh: $([ -f build/build.sh ] && echo YES || echo NO)"
          echo ""
          echo "════════ build.config.* ════════"
          ls build.config.* 2>/dev/null || echo "none"
          echo ""
          echo "════════ arch/arm64/configs (>1KB) ════════"
          for f in arch/arm64/configs/*defconfig; do
            [ -f "$f" ] || continue
            SZ=$(stat -c %s "$f")
            [ "$SZ" -gt 1000 ] && printf "  %8d  %s\n" "$SZ" "$(basename $f)"
          done

      - name: Integrate KernelSU
        if: inputs.ksu_variant != 'none'
        working-directory: ksrc
        run: |
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          echo "KSU: $(cd KernelSU && git rev-parse HEAD)"

      - name: Build (multi-strategy)
        working-directory: ksrc
        run: |
          set +e
          export PATH=/opt/tc/clang-17/bin:$PATH
          export ARCH=arm64 SUBARCH=arm64
          export HOSTCC=gcc HOSTCXX=g++ HOSTAR=ar HOSTLD=ld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
          export READELF=llvm-readelf STRIP=llvm-strip

          JOBS=$(nproc); [ "$JOBS" -gt 4 ] && JOBS=4
          BUILT=0

          # ── Strategy 1: GKI build.sh ──
          if [ -f build/build.sh ]; then
            echo ""
            echo "════ STRATEGY 1: GKI build/build.sh ════"
            for cfg in build.config.mtk_kernel_device_modules build.config.mtk.aarch64 build.config.mtk.aarch64.mgk; do
              [ -f "$cfg" ] || continue
              echo ">>> Trying BUILD_CONFIG=$cfg"
              rm -rf out
              BUILD_CONFIG="$cfg" build/build.sh 2>&1 | tail -30
              if [ -f out/arch/arm64/boot/Image ] || [ -f out/kernel-6.1/arch/arm64/boot/Image ]; then
                echo "✅ Strategy 1 success: $cfg"
                BUILT=1
                break
              fi
            done
          else
            echo "Strategy 1 skipped: no build/build.sh"
          fi

          # ── Strategy 2: make CC=clang explicitly ──
          if [ "$BUILT" != "1" ]; then
            echo ""
            echo "════ STRATEGY 2: make CC=clang defconfig ════"
            for dc in mgk_64_k61_defconfig gki_defconfig k6878v1_64_defconfig mt6878_defconfig; do
              [ -f "arch/arm64/configs/$dc" ] || continue
              echo ">>> Trying $dc"
              rm -rf out && mkdir -p out
              if make O=out ARCH=arm64 CC=clang HOSTCC=gcc "$dc" 2>&1 | tail -5; then
                if [ -f out/.config ]; then
                  echo "✅ config OK: $dc"
                  if make O=out ARCH=arm64 CC=clang HOSTCC=gcc -j"$JOBS" Image 2>&1 | tail -40; then
                    if [ -f out/arch/arm64/boot/Image ]; then
                      echo "✅ Strategy 2 success: $dc"
                      BUILT=1
                      break
                    fi
                  fi
                fi
              fi
            done
          fi

          # ── Strategy 3: GKI with gki_defconfig + mgk modules ──
          if [ "$BUILT" != "1" ] && [ -f "arch/arm64/configs/gki_defconfig" ]; then
            echo ""
            echo "════ STRATEGY 3: gki + modules ════"
            rm -rf out && mkdir -p out
            make O=out ARCH=arm64 CC=clang HOSTCC=gcc gki_defconfig 2>&1 | tail -5
            [ -f arch/arm64/configs/mgk_64_k61_defconfig ] && \
              ARCH=arm64 scripts/kconfig/merge_config.sh -O out out/.config arch/arm64/configs/mgk_64_k61_defconfig 2>&1 | tail -5
            make O=out ARCH=arm64 CC=clang HOSTCC=gcc olddefconfig 2>&1 | tail -3
            make O=out ARCH=arm64 CC=clang HOSTCC=gcc -j"$JOBS" Image 2>&1 | tail -40
            [ -f out/arch/arm64/boot/Image ] && { echo "✅ Strategy 3 success"; BUILT=1; }
          fi

          echo ""
          echo "════════ RESULT ════════"
          if [ "$BUILT" = "1" ]; then
            echo "✅ BUILD SUCCEEDED"
            ls -lh out/arch/arm64/boot/Image 2>/dev/null
          else
            echo "❌ ALL STRATEGIES FAILED"
            find . -name "Image" -type f 2>/dev/null | head
            find out -maxdepth 3 -name "*.config" -o -name "config" 2>/dev/null | head
            exit 1
          fi

      - name: Collect
        working-directory: ksrc
        run: |
          set +e
          mkdir -p ../kout
          cp -v out/arch/arm64/boot/Image ../kout/ 2>/dev/null
          cp -v out/arch/arm64/boot/Image.gz ../kout/ 2>/dev/null
          cp -v out/arch/arm64/boot/Image.lz4 ../kout/ 2>/dev/null
          find out -name "*.dtb" -exec cp {} ../kout/ \; 2>/dev/null
          cp -v out/vmlinux ../kout/ 2>/dev/null
          cp -v out/System.map ../kout/ 2>/dev/null
          find out -name "*.ko" -type f 2>/dev/null | head -200 | while read ko; do
            cp "$ko" ../kout/ 2>/dev/null
          done
          echo "Collected:"; ls -lh ../kout/ | head -20

      - name: Verify
        run: |
          set +e
          cd kout 2>/dev/null || { echo "no kout"; exit 1; }
          OK=0
          for f in Image Image.gz Image.lz4 vmlinux; do
            [ -f "$f" ] && { echo "✅ $f: $(stat -c %s "$f")"; OK=1; }
          done
          [ -f Image ] && {
            echo "Kernel: $(strings Image | grep -E 'Linux version 6\.' | head -1)"
            echo "KSU: $(strings Image | grep -icE 'kernelsu|ksu_')"
          }
          echo "Modules: $(ls *.ko 2>/dev/null | wc -l)"
          echo "DTBs: $(ls *.dtb 2>/dev/null | wc -l)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-lxx521-${{ github.run_number }}
          path: kout/
          if-no-files-found: warn
          retention-days: 30
