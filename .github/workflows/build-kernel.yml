name: Build Custom Kernel MT6878

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Kernel repo"
        required: true
        default: "NothingOSS/android_kernel_6.1_nothing_mt6878"
      kernel_branch:
        description: "Branch"
        required: true
        default: "main"
      defconfig:
        description: "Defconfig (empty=auto)"
        required: false
        default: ""
      ksu_variant:
        description: "KernelSU"
        required: true
        default: "KernelSU-Next"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/share/swift /opt/az \
                      /usr/local/.ghcup /opt/pipx /usr/share/miniconda || true
          sudo apt-get clean
          df -h /

      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex git git-lfs \
            gnupg gperf kmod libelf-dev libssl-dev lz4 lzop \
            python3 python3-pip rsync unzip zip zlib1g-dev \
            libncurses5-dev libncursesw5-dev cpio xz-utils \
            device-tree-compiler

      - name: Get clang 17
        run: |
          sudo mkdir -p /opt/tc/clang-17
          cd /opt/tc/clang-17
          sudo curl -fsSL --retry 3 -o c.tgz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r74/clang-r487747c.tar.gz"
          sudo tar xzf c.tgz
          sudo rm c.tgz
          /opt/tc/clang-17/bin/clang --version

      - name: Clone kernel
        run: |
          set -e
          R="${{ inputs.kernel_source }}"
          B="${{ inputs.kernel_branch }}"
          echo ">>> cloning $R @ $B"
          if ! git clone --depth=1 --branch "$B" "https://github.com/$R.git" ksrc 2>&1 | tail -3; then
            echo ">>> branch failed, trying default"
            git clone --depth=1 "https://github.com/$R.git" ksrc
          fi
          cd ksrc
          echo "HEAD: $(git log -1 --oneline)"

      - name: Diagnostics
        working-directory: ksrc
        run: |
          set +e
          echo "════════ DIAGNOSTICS ════════"
          echo ">>> Top-level:"
          ls -la | head -30
          echo ""
          echo ">>> Makefile exists?"
          [ -f Makefile ] && { echo "YES"; head -20 Makefile; } || echo "NO"
          echo ""
          echo ">>> configs (mtk/mt6878/nothing):"
          ls arch/arm64/configs/ 2>/dev/null | grep -iE "mtk|mt6878|nothing|defconfig" | head -30
          echo ""
          echo ">>> total configs:"
          ls arch/arm64/configs/ 2>/dev/null | wc -l
          echo ""
          echo ">>> size of defconfigs:"
          ls -la arch/arm64/configs/*defconfig 2>/dev/null | head -20

      - name: Integrate KernelSU
        if: inputs.ksu_variant != 'none'
        working-directory: ksrc
        run: |
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          echo "KSU: $(cd KernelSU && git rev-parse HEAD)"

      - name: Find defconfig
        id: dc
        working-directory: ksrc
        run: |
          set +e
          # Check Makefile exists first
          if [ ! -f Makefile ]; then
            echo "::error::No Makefile — this is NOT a standalone kernel"
            exit 1
          fi

          D="${{ inputs.defconfig }}"
          if [ -n "$D" ] && [ -f "arch/arm64/configs/$D" ]; then
            echo "name=$D" >> $GITHUB_OUTPUT
            echo "Using: $D"
            exit 0
          fi

          # Auto-detect
          for pat in "nothing" "mt6878" "mt6835" "mtk"; do
            for f in arch/arm64/configs/*${pat}*_defconfig; do
              [ -f "$f" ] || continue
              BN=$(basename "$f")
              echo "name=$BN" >> $GITHUB_OUTPUT
              echo "Auto: $BN"
              exit 0
            done
          done

          # Any defconfig
          for f in arch/arm64/configs/*_defconfig; do
            [ -f "$f" ] || continue
            BN=$(basename "$f")
            echo "name=$BN" >> $GITHUB_OUTPUT
            echo "Fallback: $BN"
            exit 0
          done

          echo "::error::No defconfig found"
          exit 1

      - name: Configure
        working-directory: ksrc
        run: |
          set -euo pipefail
          export PATH=/opt/tc/clang-17/bin:$PATH
          export ARCH=arm64 SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
          export READELF=llvm-readelf STRIP=llvm-strip

          DC="${{ steps.dc.outputs.name }}"
          echo ">>> make O=out $DC"
          make O=out ARCH=arm64 "$DC"

          # Check .config was created
          if [ ! -f out/.config ]; then
            echo "::error::make defconfig did not create out/.config"
            exit 1
          fi
          echo "✅ .config created: $(stat -c %s out/.config) bytes"

          # KSU configs
          if [ "${{ inputs.ksu_variant }}" != "none" ]; then
            ./scripts/config --file out/.config \
              -e CONFIG_KSU \
              -e CONFIG_KALLSYMS \
              -e CONFIG_KALLSYMS_ALL \
              -e CONFIG_MODULES \
              -d CONFIG_MODULE_SIG \
              -d CONFIG_MODULE_SIG_ALL \
              -d CONFIG_MODULE_SIG_FORCE \
              -d CONFIG_MODVERSIONS || true
            make O=out ARCH=arm64 olddefconfig
          fi

          echo ""
          echo "=== Config summary ==="
          grep -E "^CONFIG_(KSU|KALLSYMS|MODULES|MODVERSIONS|LOCALVERSION)" out/.config | head -10

      - name: Build
        working-directory: ksrc
        run: |
          set -euo pipefail
          export PATH=/opt/tc/clang-17/bin:$PATH
          export ARCH=arm64 SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
          export READELF=llvm-readelf STRIP=llvm-strip

          JOBS=$(nproc)
          [ "$JOBS" -gt 4 ] && JOBS=4
          echo ">>> Building -j$JOBS"

          # Force rebuild — check exit code properly
          set +e
          make O=out ARCH=arm64 -j"$JOBS" Image 2>&1 | tail -200
          IMG_RC=${PIPESTATUS[0]}
          set -e
          echo "Image build rc: $IMG_RC"

          if [ "$IMG_RC" != "0" ]; then
            echo "::error::Image build failed"
            exit 1
          fi

          # Verify Image exists
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "::error::Image not produced despite rc=0"
            ls -la out/arch/arm64/boot/
            exit 1
          fi
          echo "✅ Image: $(stat -c %s out/arch/arm64/boot/Image) bytes"

          # Optional: dtbs and modules
          set +e
          make O=out ARCH=arm64 -j"$JOBS" dtbs 2>&1 | tail -20
          make O=out ARCH=arm64 -j"$JOBS" modules 2>&1 | tail -30
          set -e

      - name: Collect
        working-directory: ksrc
        run: |
          set +e
          mkdir -p ../kout
          cp -v out/arch/arm64/boot/Image ../kout/ 2>/dev/null
          cp -v out/arch/arm64/boot/Image.gz ../kout/ 2>/dev/null
          cp -v out/arch/arm64/boot/Image.lz4 ../kout/ 2>/dev/null
          cp -v out/arch/arm64/boot/dts/**/*.dtb ../kout/ 2>/dev/null
          cp -v out/vmlinux ../kout/ 2>/dev/null
          cp -v out/System.map ../kout/ 2>/dev/null
          find out -name "*.ko" -type f 2>/dev/null | head -200 | while read ko; do
            cp "$ko" ../kout/ 2>/dev/null
          done
          echo "=== kout ==="
          ls -lh ../kout/ | head -30

      - name: Verify
        run: |
          set +e
          cd kout
          echo "════════ VERIFY ════════"
          OK=0
          for f in Image Image.gz Image.lz4 vmlinux; do
            [ -f "$f" ] && { echo "✅ $f: $(stat -c %s "$f") bytes"; OK=1; }
          done
          [ -f Image ] && {
            echo ""
            echo "Kernel: $(strings Image | grep -E 'Linux version 6\.' | head -1)"
            echo "KSU:    $(strings Image | grep -icE 'kernelsu|ksu_')"
          }
          echo "Modules: $(ls *.ko 2>/dev/null | wc -l)"
          echo "DTBs:    $(ls *.dtb 2>/dev/null | wc -l)"
          [ "$OK" = "1" ] && echo "✅ KERNEL BUILT" || { echo "❌ NO KERNEL"; exit 1; }

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-lxx521-${{ github.run_number }}
          path: kout/
          if-no-files-found: warn
          retention-days: 30
