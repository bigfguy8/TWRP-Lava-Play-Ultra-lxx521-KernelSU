name: Build Custom Kernel MT6878

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Kernel repo"
        required: true
        default: "mt6878-devs/android_kernel_device_modules"
      kernel_branch:
        description: "Branch"
        required: true
        default: "lineage-23.2"
      ksu_variant:
        description: "KernelSU variant"
        required: true
        default: "KernelSU-Next"
      defconfig:
        description: "Defconfig (empty=auto)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/share/swift /opt/az \
                      /usr/local/.ghcup /opt/pipx /usr/share/miniconda || true
          sudo apt-get clean
          df -h /

      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex git git-lfs \
            gnupg gperf kmod libelf-dev libssl-dev lz4 lzop \
            python3 python3-pip rsync unzip zip zlib1g-dev \
            libncurses5-dev libncursesw5-dev cpio xz-utils \
            device-tree-compiler

      - name: Get clang 17
        run: |
          sudo mkdir -p /opt/tc && cd /opt/tc
          sudo curl -fsSL --retry 3 -o clang.tar.gz \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r74/clang-r487747c.tar.gz
          sudo tar xzf clang.tar.gz && sudo rm clang.tar.gz
          sudo mv clang-r487747c clang-17
          /opt/tc/clang-17/bin/clang --version

      - name: Clone kernel
        run: |
          set -e
          R="${{ inputs.kernel_source }}"
          B="${{ inputs.kernel_branch }}"
          git clone --depth=1 --branch "$B" "https://github.com/$R.git" ksrc 2>&1 | tail -3 || \
            git clone --depth=1 "https://github.com/$R.git" ksrc
          cd ksrc
          echo "HEAD: $(git log -1 --oneline)"
          echo ""
          echo "=== arch/arm64/configs listing ==="
          ls arch/arm64/configs/ 2>/dev/null | grep -iE "k6878|mt6878|lxx521" || echo "no mtk-specific"
          echo ""
          echo "=== total defconfigs ==="
          ls arch/arm64/configs/ 2>/dev/null | wc -l

      - name: Integrate KernelSU
        if: inputs.ksu_variant != 'none'
        working-directory: ksrc
        run: |
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          echo "KSU HEAD: $(cd KernelSU && git rev-parse HEAD)"

      - name: Find defconfig
        id: dc
        working-directory: ksrc
        run: |
          set +e
          D="${{ inputs.defconfig }}"
          if [ -n "$D" ] && [ -f "arch/arm64/configs/$D" ]; then
            echo "name=$D" >> $GITHUB_OUTPUT
            echo "Using provided: $D"
            exit 0
          fi
          for f in arch/arm64/configs/*k6878* arch/arm64/configs/*mt6878* arch/arm64/configs/*lxx521*; do
            [ -f "$f" ] || continue
            echo "name=$(basename $f)" >> $GITHUB_OUTPUT
            echo "Auto: $(basename $f)"
            exit 0
          done
          for f in arch/arm64/configs/gki_defconfig arch/arm64/configs/*defconfig; do
            [ -f "$f" ] || continue
            echo "name=$(basename $f)" >> $GITHUB_OUTPUT
            echo "Fallback: $(basename $f)"
            exit 0
          done

      - name: Build
        working-directory: ksrc
        run: |
          set -e
          export PATH=/opt/tc/clang-17/bin:$PATH
          export ARCH=arm64 SUBARCH=arm64 CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
          export READELF=llvm-readelf STRIP=llvm-strip

          DC="${{ steps.dc.outputs.name }}"
          echo ">>> make O=out $DC"
          make O=out ARCH=arm64 "$DC"

          if [ "${{ inputs.ksu_variant }}" != "none" ]; then
            ./scripts/config --file out/.config \
              -e CONFIG_KSU -e CONFIG_KALLSYMS -e CONFIG_KALLSYMS_ALL \
              -e CONFIG_MODULES -d CONFIG_MODULE_SIG -d CONFIG_MODVERSIONS || true
            make O=out ARCH=arm64 olddefconfig 2>&1 | tail -2
          fi

          grep -E "^CONFIG_(KSU|KALLSYMS|MODULES|MODVERSIONS)=" out/.config | head -10

          echo ""
          echo ">>> Compiling (j=$(nproc))"
          make O=out ARCH=arm64 -j"$(nproc)" Image 2>&1 | tail -150
          make O=out ARCH=arm64 -j"$(nproc)" dtbs 2>&1 | tail -20 || true
          make O=out ARCH=arm64 -j"$(nproc)" modules 2>&1 | tail -30 || true

      - name: Collect
        working-directory: ksrc
        run: |
          set +e
          mkdir -p ../kout
          find out/arch/arm64/boot -type f \( -name "Image*" -o -name "*.dtb" -o -name "dtbo.img" \) -exec cp {} ../kout/ \; 2>/dev/null
          find out -name "*.ko" -type f -exec cp {} ../kout/ \; 2>/dev/null
          cp out/System.map ../kout/ 2>/dev/null || true
          echo "=== Collected ==="
          ls -lh ../kout/ | head -30

      - name: Verify
        run: |
          set +e
          cd kout
          echo "════════ VERIFY ════════"
          OK=0
          for f in Image Image.gz Image.lz4 vmlinux; do
            [ -f "$f" ] && { echo "✅ $f: $(stat -c %s $f) bytes"; OK=1; }
          done
          [ -f Image ] && {
            echo ""
            echo "Kernel: $(strings Image | grep -E 'Linux version 6\.' | head -1)"
            echo "vermagic: $(strings Image | grep -E '^6\.[0-9]+\.[0-9]+[^ ]* SMP' | head -1)"
            echo "KSU refs: $(strings Image | grep -icE 'kernelsu|ksu_')"
          }
          echo "Modules: $(ls *.ko 2>/dev/null | wc -l)"
          [ "$OK" = "1" ] && echo "✅ Kernel built" || { echo "❌ No kernel"; exit 1; }

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-lxx521-${{ github.run_number }}
          path: kout/
          if-no-files-found: warn
          retention-days: 30
