name: Build Kernel MT6878

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        default: "NothingOSS/android_kernel_6.1_nothing_mt6878"
      kernel_branch:
        default: "mt6878/Tetris/v"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex git git-lfs \
            gperf kmod libelf-dev libssl-dev lz4 lzop \
            python3 python3-pip rsync unzip zip zlib1g-dev \
            cpio xz-utils device-tree-compiler \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi libc6-dev-arm64-cross libc6-dev-armhf-cross
          echo "GCC: $(aarch64-linux-gnu-gcc --version | head -1)"

      - name: Clang 17
        run: |
          sudo mkdir -p /opt/tc/clang-17 && cd /opt/tc/clang-17
          sudo curl -fsSL --retry 3 -o c.tgz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r74/clang-r487747c.tar.gz"
          sudo tar xzf c.tgz && sudo rm c.tgz
          /opt/tc/clang-17/bin/clang --version | head -1

      - name: Clone + list configs
        run: |
          R="${{ inputs.kernel_source }}"
          B="${{ inputs.kernel_branch }}"
          git clone --depth=1 --branch "$B" "https://github.com/$R.git" ksrc
          cd ksrc
          echo "=== Top-level (first 10) ==="; ls -1 | head -10
          echo ""
          echo "=== build/build.sh ==="; [ -f build/build.sh ] && echo YES || echo NO
          echo ""
          echo "=== All defconfigs ==="
          ls -la arch/arm64/configs/*defconfig 2>/dev/null
          echo ""
          echo "=== arch/arm64/boot/dts dirs ==="
          ls arch/arm64/boot/dts/ 2>/dev/null | head -20
          echo ""
          echo "=== Search for mt6878 dts ==="
          find arch/arm64/boot/dts -iname "*mt6878*" -o -iname "*k6878*" 2>/dev/null | head -10
          echo ""
          echo "=== Drivers for mediatek ==="
          ls drivers/ 2>/dev/null | grep -i mediatek

      - name: KSU manual integration
        working-directory: ksrc
        run: |
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU 2>&1 | tail -2
          [ -d KernelSU ] || { echo "::error::KSU clone failed"; exit 1; }
          grep -q 'KernelSU/Kconfig' Kconfig || echo 'source "KernelSU/Kconfig"' >> Kconfig
          grep -q 'CONFIG_KSU' Makefile || echo 'obj-$(CONFIG_KSU) += KernelSU/' >> Makefile
          echo "✅ Kconfig: $(grep -c KernelSU Kconfig) lines"
          echo "✅ Makefile: $(grep -c KernelSU Makefile) lines"

      - name: Build Image
        working-directory: ksrc
        run: |
          set +e
          export PATH=/opt/tc/clang-17/bin:$PATH
          export ARCH=arm64 SUBARCH=arm64
          export CC=clang HOSTCC=gcc HOSTCXX=g++ HOSTAR=ar HOSTLD=ld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
          export READELF=llvm-readelf STRIP=llvm-strip

          # ── Pick defconfig: proper for loop ──
          DEFCONFIG=""
          for cand in gki_defconfig defconfig; do
            if [ -f "arch/arm64/configs/$cand" ]; then
              DEFCONFIG="$cand"
              break
            fi
          done

          if [ -z "$DEFCONFIG" ]; then
            echo "::error::No suitable defconfig found"
            ls arch/arm64/configs/ | head -20
            exit 1
          fi

          echo "════════ USING: $DEFCONFIG ════════"
          rm -rf out && mkdir -p out

          echo ""
          echo "════════ make defconfig ════════"
          make O=out ARCH=arm64 CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- "$DEFCONFIG" 2>&1 | tail -15

          [ -f out/.config ] || { echo "::error::No .config"; exit 1; }
          echo "Config: $(stat -c %s out/.config) bytes"

          echo ""
          echo "════════ Enable KSU + required ════════"
          ./scripts/config --file out/.config \
            -e CONFIG_KSU -e CONFIG_KALLSYMS -e CONFIG_KALLSYMS_ALL \
            -e CONFIG_MODULES -d CONFIG_MODULE_SIG -d CONFIG_MODULE_SIG_ALL \
            -d CONFIG_MODVERSIONS 2>&1 | tail -3

          make O=out ARCH=arm64 CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- olddefconfig 2>&1 | tail -3

          echo "CONFIG_KSU: $(grep '^CONFIG_KSU=' out/.config || echo NOT_SET)"

          echo ""
          echo "════════ make Image (-j$(nproc)) ════════"
          make O=out ARCH=arm64 CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)" Image 2>&1 | tail -100

          echo ""
          echo "════════ VERIFY ════════"
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ No Image produced"
            find out -name "Image*" -type f 2>/dev/null | head
            exit 1
          fi

          SZ=$(stat -c %s out/arch/arm64/boot/Image)
          echo "Image size: $SZ bytes"
          [ "$SZ" -gt 500000 ] || { echo "❌ Too small"; exit 1; }

          echo "Kernel: $(strings out/arch/arm64/boot/Image | grep 'Linux version 6' | head -1)"
          echo "KSU refs: $(strings out/arch/arm64/boot/Image | grep -icE 'kernelsu|ksu_')"
          echo "✅ BUILD SUCCEEDED"

      - name: Collect
        working-directory: ksrc
        run: |
          set +e
          mkdir -p ../kout
          cp -v out/arch/arm64/boot/Image ../kout/ 2>/dev/null
          cp -v out/arch/arm64/boot/Image.gz ../kout/ 2>/dev/null
          cp -v out/vmlinux ../kout/ 2>/dev/null
          cp -v out/System.map ../kout/ 2>/dev/null
          find out -name "*.ko" 2>/dev/null | head -100 | while read f; do cp "$f" ../kout/ 2>/dev/null; done
          ls -lh ../kout/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-lxx521-${{ github.run_number }}
          path: kout/
          if-no-files-found: warn
          retention-days: 30
