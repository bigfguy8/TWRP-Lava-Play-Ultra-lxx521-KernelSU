name: Build Kernel MT6878 (GKI + stock config)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          set +e
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex git git-lfs \
            gperf kmod libelf-dev libssl-dev lz4 lzop \
            python3 python3-pip rsync unzip zip zlib1g-dev \
            cpio xz-utils device-tree-compiler \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi libc6-dev-arm64-cross libc6-dev-armhf-cross
          aarch64-linux-gnu-gcc --version | head -1

      - name: Clang 17
        run: |
          set +e
          sudo mkdir -p /opt/tc/clang-17 && cd /opt/tc/clang-17
          sudo curl -fsSL --retry 3 -o c.tgz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r74/clang-r487747c.tar.gz"
          sudo tar xzf c.tgz && sudo rm c.tgz
          /opt/tc/clang-17/bin/clang --version | head -1

      - name: Clone Google Android Common Kernel
        run: |
          set +e
          # Clone android14-6.1 (matches stock kernel 6.1.115)
          git clone --depth=1 --branch android14-6.1 \
            https://android.googlesource.com/kernel/common ksrc
          if [ ! -d ksrc ]; then
            echo "::error::Clone failed"
            exit 1
          fi
          cd ksrc
          echo "HEAD: $(git log -1 --oneline)"
          echo "Makefile version:"
          head -5 Makefile
          echo ""
          echo "=== Stock config check ==="
          ls -la ../kernel-config/lxx521_defconfig

      - name: Prepare defconfig (disable MODVERSIONS, MODULE_SIG for KSU)
        run: |
          set +e
          cd ksrc
          mkdir -p arch/arm64/configs
          cp ../kernel-config/lxx521_defconfig arch/arm64/configs/lxx521_defconfig

          echo "=== Modifying config for KSU ==="
          # Disable MODVERSIONS and MODULE_SIG (KSU requires)
          sed -i 's/^CONFIG_MODVERSIONS=y/# CONFIG_MODVERSIONS is not set/' arch/arm64/configs/lxx521_defconfig
          sed -i 's/^CONFIG_MODULE_SIG=y/# CONFIG_MODULE_SIG is not set/' arch/arm64/configs/lxx521_defconfig
          sed -i 's/^CONFIG_MODULE_SIG_ALL=y/# CONFIG_MODULE_SIG_ALL is not set/' arch/arm64/configs/lxx521_defconfig
          sed -i 's/^CONFIG_MODULE_SIG_FORCE=y/# CONFIG_MODULE_SIG_FORCE is not set/' arch/arm64/configs/lxx521_defconfig
          sed -i 's/^CONFIG_MODULE_SIG_PROTECT=y/# CONFIG_MODULE_SIG_PROTECT is not set/' arch/arm64/configs/lxx521_defconfig

          echo "After modification:"
          grep -E "^CONFIG_MODVERSIONS|^CONFIG_MODULE_SIG" arch/arm64/configs/lxx521_defconfig || echo "All disabled ✅"

      - name: Integrate KernelSU
        working-directory: ksrc
        run: |
          set +e
          # Use KernelSU-Next for Android 14-6.1
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          if [ ! -d KernelSU ]; then
            echo "::error::KSU clone failed"
            exit 1
          fi

          # Auto-integrate using setup.sh
          if [ -f KernelSU/kernel/setup.sh ]; then
            echo "=== Running official setup.sh ==="
            bash KernelSU/kernel/setup.sh
          fi

          # Manual fallback
          grep -q 'KernelSU/Kconfig' Kconfig || echo 'source "KernelSU/Kconfig"' >> Kconfig
          grep -q 'CONFIG_KSU' Makefile || echo 'obj-$(CONFIG_KSU) += KernelSU/' >> Makefile

          echo "KSU verify:"
          grep KernelSU Kconfig | head -2
          grep CONFIG_KSU Makefile | head -2

      - name: Build Kernel
        working-directory: ksrc
        run: |
          set +e
          export PATH=/opt/tc/clang-17/bin:$PATH
          export ARCH=arm64 SUBARCH=arm64
          export CC=clang HOSTCC=gcc HOSTCXX=g++ HOSTAR=ar HOSTLD=ld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
          export READELF=llvm-readelf STRIP=llvm-strip

          rm -rf out
          mkdir -p out

          echo "════════ make lxx521_defconfig ════════"
          make O=out ARCH=arm64 CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- lxx521_defconfig 2>&1 | tail -10
          if [ ! -f out/.config ]; then
            echo "::error::defconfig failed"
            exit 1
          fi
          echo ".config: $(stat -c %s out/.config) bytes"

          echo ""
          echo "════════ Enable KSU in config ════════"
          ./scripts/config --file out/.config \
            -e CONFIG_KSU -e CONFIG_KALLSYMS -e CONFIG_KALLSYMS_ALL \
            -e CONFIG_MODULES \
            -d CONFIG_MODVERSIONS \
            -d CONFIG_MODULE_SIG -d CONFIG_MODULE_SIG_ALL -d CONFIG_MODULE_SIG_FORCE \
            -d CONFIG_MODULE_SIG_PROTECT

          make O=out ARCH=arm64 CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- olddefconfig 2>&1 | tail -5

          echo ""
          echo "=== Final KSU symbols ==="
          grep -E "^CONFIG_(KSU|MODVERSIONS|MODULE_SIG|KALLSYMS|MODULES)=" out/.config

          echo ""
          echo "════════ make Image (-j4) ════════"
          make O=out ARCH=arm64 CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 Image 2>&1 | tail -80

          echo ""
          echo "════════ Verify ════════"
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "::error::No Image"
            find out -name "Image*" -type f | head
            exit 1
          fi
          SZ=$(stat -c %s out/arch/arm64/boot/Image)
          echo "Image: $SZ bytes"
          [ "$SZ" -gt 500000 ] || { echo "::error::Too small"; exit 1; }
          echo "Kernel version: $(strings out/arch/arm64/boot/Image | grep 'Linux version 6' | head -1)"
          echo "KSU refs: $(strings out/arch/arm64/boot/Image | grep -icE 'kernelsu|ksu_')"
          echo "vermagic: $(strings out/arch/arm64/boot/Image | grep -E '^6\.1\.' | head -1)"
          echo "✅ BUILD SUCCEEDED"

      - name: Collect
        working-directory: ksrc
        run: |
          set +e
          mkdir -p ../kout
          cp -v out/arch/arm64/boot/Image ../kout/ 2>/dev/null
          cp -v out/arch/arm64/boot/Image.gz ../kout/ 2>/dev/null
          cp -v out/vmlinux ../kout/ 2>/dev/null
          cp -v out/System.map ../kout/ 2>/dev/null
          cp -v out/.config ../kout/config-final
          find out -name "*.ko" 2>/dev/null | head -50 | while read f; do cp "$f" ../kout/ 2>/dev/null; done
          ls -lh ../kout/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-lxx521-${{ github.run_number }}
          path: kout/
          if-no-files-found: warn
          retention-days: 30
