name: Build Kernel MT6878

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        default: "NothingOSS/android_kernel_6.1_nothing_mt6878"
      kernel_branch:
        default: "mt6878/Tetris/v"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex git git-lfs \
            gperf kmod libelf-dev libssl-dev lz4 lzop \
            python3 python3-pip rsync unzip zip zlib1g-dev \
            cpio xz-utils device-tree-compiler \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi libc6-dev-arm64-cross libc6-dev-armhf-cross
          echo "=== GCC cross ==="
          aarch64-linux-gnu-gcc --version | head -1

      - name: Clang 17
        run: |
          sudo mkdir -p /opt/tc/clang-17 && cd /opt/tc/clang-17
          sudo curl -fsSL --retry 3 -o c.tgz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r74/clang-r487747c.tar.gz"
          sudo tar xzf c.tgz && sudo rm c.tgz
          /opt/tc/clang-17/bin/clang --version | head -1

      - name: Clone
        run: |
          R="${{ inputs.kernel_source }}"
          B="${{ inputs.kernel_branch }}"
          git clone --depth=1 --branch "$B" "https://github.com/$R.git" ksrc
          cd ksrc
          echo "Makefile: $([ -f Makefile ] && echo YES || echo NO)"
          echo "build.config.*: $(ls build.config.* 2>/dev/null | wc -l) files"
          echo ""
          echo "=== Configs (>1KB) ==="
          for f in arch/arm64/configs/*defconfig; do
            [ -f "$f" ] || continue
            SZ=$(stat -c %s "$f")
            [ "$SZ" -gt 1000 ] && printf "  %7d  %s\n" "$SZ" "$(basename $f)"
          done

      - name: KSU manual integration
        working-directory: ksrc
        run: |
          set +e
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU 2>&1 | tail -2
          [ -d KernelSU ] || { echo "::error::KSU clone failed"; exit 1; }

          # Patch Kconfig
          grep -q 'KernelSU/Kconfig' Kconfig || echo 'source "KernelSU/Kconfig"' >> Kconfig

          # Patch Makefile
          grep -q 'CONFIG_KSU' Makefile || echo 'obj-$(CONFIG_KSU) += KernelSU/' >> Makefile

          echo "KernelSU dir: $(ls KernelSU/ | wc -l) files"
          grep "KernelSU/Kconfig" Kconfig && echo "✅ Kconfig"
          grep "CONFIG_KSU" Makefile && echo "✅ Makefile"

      - name: Build Image
        working-directory: ksrc
        run: |
          set +e
          export PATH=/opt/tc/clang-17/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export HOSTCC=gcc
          export HOSTCXX=g++
          export HOSTAR=ar
          export HOSTLD=ld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip

          rm -rf out && mkdir -p out

          echo "════════ 1) make defconfig ════════"
          make O=out ARCH=arm64 "$DEFCONFIG" \
            CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- \
            "$(ls arch/arm64/configs/*mt6878* arch/arm64/configs/*nothing* arch/arm64/configs/mgk_64_k61_defconfig arch/arm64/configs/gki_defconfig 2>/dev/null | head -1 | xargs basename)" 2>&1 | tail -20

          echo ""
          echo "════════ 2) find .config ════════"
          ls -la out/.config 2>/dev/null || { echo "❌ no .config"; exit 1; }
          echo "Config size: $(stat -c %s out/.config) bytes"

          echo ""
          echo "════════ 3) enable KSU ════════"
          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KALLSYMS \
            -e CONFIG_KALLSYMS_ALL \
            -e CONFIG_MODULES \
            -d CONFIG_MODULE_SIG \
            -d CONFIG_MODULE_SIG_ALL \
            -d CONFIG_MODVERSIONS \
            -d CONFIG_SECURITY_SELINUX_DEVELOP 2>&1 || true

          make O=out ARCH=arm64 CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- olddefconfig 2>&1 | tail -5

          echo ""
          echo "=== CONFIG_KSU check ==="
          grep -E "^CONFIG_KSU" out/.config || echo "⚠️ CONFIG_KSU not set"

          echo ""
          echo "════════ 4) make Image ════════"
          make O=out ARCH=arm64 CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)" Image 2>&1 | tail -80

          echo ""
          echo "════════ 5) verify Image ════════"
          ls -la out/arch/arm64/boot/Image 2>/dev/null || { echo "❌ No Image"; exit 1; }
          SZ=$(stat -c %s out/arch/arm64/boot/Image)
          echo "Image size: $SZ bytes"
          [ "$SZ" -gt 500000 ] || { echo "❌ Image too small"; exit 1; }
          echo "Kernel: $(strings out/arch/arm64/boot/Image | grep 'Linux version 6' | head -1)"
          echo "KSU refs: $(strings out/arch/arm64/boot/Image | grep -icE 'kernelsu|ksu_')"
          echo "✅ BUILD SUCCEEDED"

      - name: Collect
        working-directory: ksrc
        run: |
          set +e
          mkdir -p ../kout
          cp -v out/arch/arm64/boot/Image ../kout/ 2>/dev/null
          cp -v out/arch/arm64/boot/Image.gz ../kout/ 2>/dev/null
          cp -v out/vmlinux ../kout/ 2>/dev/null
          cp -v out/System.map ../kout/ 2>/dev/null
          find out -name "*.ko" 2>/dev/null | head -100 | while read f; do cp "$f" ../kout/ 2>/dev/null; done
          ls -lh ../kout/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-lxx521-${{ github.run_number }}
          path: kout/
          if-no-files-found: warn
          retention-days: 30
