name: Build KernelSU-Next init_boot (magiskboot)

on:
  workflow_dispatch:
    inputs:
      ksu_version:
        description: "KSU-Next version"
        required: true
        default: "v3.4.1"
      kmi:
        description: "KMI"
        required: true
        default: "android14-6.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify stock
        run: |
          export TARGET_RELEASE=ap3a
          ls -lh init_boot_stock.img
          C=$(strings -a init_boot_stock.img 2>/dev/null | grep -cE "kernelsu|ksud|u:r:ksu" || echo 0)
          echo "KSU refs in stock: $C"
          if [ "$C" -ge 3 ]; then echo "Already patched"; exit 1; fi

      - name: Download magiskboot + KSU assets
        run: |
          export TARGET_RELEASE=ap3a
          set -e
          KSU_VER="${{ inputs.ksu_version }}"
          KMI="${{ inputs.kmi }}"
          BASE="https://github.com/KernelSU-Next/KernelSU-Next/releases/download/${KSU_VER}"

          echo ">>> magiskboot"
          curl -fL --retry 3 -o magiskboot https://github.com/Uevo001/magiskboot-linux/raw/main/x86_64/magiskboot
          chmod +x magiskboot
          ./magiskboot 2>&1 | head -15 || true

          echo ">>> kernelsu.ko"
          curl -fL --retry 3 -o kernelsu.ko "${BASE}/aarch64_${KMI}_kernelsu.ko"

          echo ">>> Manager APK"
          APK_NAME=$(curl -s "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/tags/${KSU_VER}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); n=[a['name'] for a in d.get('assets',[]) if a['name'].endswith('-release.apk') and 'spoofed' not in a['name']]; print(n[0] if n else '')" 2>/dev/null || echo "")
          [ -n "$APK_NAME" ] || { echo "APK not found"; exit 1; }
          curl -fL --retry 3 -o kernelsu-manager.apk "${BASE}/${APK_NAME}"

          ls -lh magiskboot kernelsu.ko kernelsu-manager.apk

      - name: Unpack init_boot.img
        run: |
          export TARGET_RELEASE=ap3a
          set -e
          cp init_boot_stock.img boot.img
          ./magiskboot unpack boot.img
          echo "=== Unpacked ==="
          ls -la
          echo "=== ramdisk.cpio ==="
          ls -lh ramdisk.cpio

      - name: Inspect ramdisk
        run: |
          export TARGET_RELEASE=ap3a
          set +e
          echo "=== cpio test ==="
          ./magiskboot cpio ramdisk.cpio test 2>&1 | head -40
          echo ""
          echo "=== init.rc? ==="
          ./magiskboot cpio ramdisk.cpio "exists init.rc" 2>&1
          echo "=== init binary? ==="
          ./magiskboot cpio ramdisk.cpio "exists init" 2>&1
          echo "=== lib/modules? ==="
          ./magiskboot cpio ramdisk.cpio "exists lib" 2>&1

      - name: Patch ramdisk with KernelSU
        run: |
          export TARGET_RELEASE=ap3a
          set -e

          # Extract init.rc BEFORE modifications
          rm -f init.rc
          ./magiskboot cpio ramdisk.cpio "extract init.rc init.rc" || {
            echo "init.rc not found at root, will skip import patch"
          }

          # Create module directory
          ./magiskboot cpio ramdisk.cpio "mkdir 0755 lib" || true
          ./magiskboot cpio ramdisk.cpio "mkdir 0755 lib/modules" || true

          # Add kernelsu.ko
          ./magiskboot cpio ramdisk.cpio "add 0644 lib/modules/kernelsu.ko kernelsu.ko"

          # Create rc file
          cat > init.kernelsu.rc << 'RCEOF'
          on post-fs-data
              insmod /lib/modules/kernelsu.ko
          RCEOF
          ./magiskboot cpio ramdisk.cpio "add 0644 init.kernelsu.rc init.kernelsu.rc"

          # Patch init.rc if it existed
          if [ -f init.rc ]; then
            cp init.rc init.rc.new
            echo "" >> init.rc.new
            echo "import /init.kernelsu.rc" >> init.rc.new
            ./magiskboot cpio ramdisk.cpio "add 0644 init.rc init.rc.new"
            echo "✅ init.rc patched"
          fi

          # Verify
          ./magiskboot cpio ramdisk.cpio "exists lib/modules/kernelsu.ko" && echo "✅ ko present" || echo "❌ ko missing"
          ./magiskboot cpio ramdisk.cpio "exists init.kernelsu.rc" && echo "✅ rc present" || echo "❌ rc missing"

      - name: Repack
        run: |
          export TARGET_RELEASE=ap3a
          set -e
          mkdir -p output
          ./magiskboot repack boot.img output/init_boot-patched.img
          ls -lh output/
          echo "MD5: $(md5sum output/init_boot-patched.img | awk '{print $1}')"

      - name: Verify output
        run: |
          export TARGET_RELEASE=ap3a
          set -e
          P="output/init_boot-patched.img"
          [ -f "$P" ] || { echo "No output file"; exit 1; }

          SIZE=$(stat -c %s "$P")
          echo "Size: $SIZE"

          MAGIC=$(head -c 8 "$P" | tr -d '\0')
          echo "Magic: $MAGIC"
          [ "${MAGIC:0:8}" = "ANDROID!" ] || { echo "Bad magic"; exit 1; }

          C=$(strings -a "$P" | grep -cE "kernelsu|ksud|u:r:ksu" || echo 0)
          echo "KSU refs: $C"
          [ "$C" -ge 3 ] || { echo "Too few refs"; exit 1; }

          echo "=== Full diff ==="
          cmp -l "$P" init_boot_stock.img 2>/dev/null | wc -l

          sha256sum "$P" init_boot_stock.img

      - name: Prepare artifact
        run: |
          export TARGET_RELEASE=ap3a
          cp init_boot_stock.img output/
          cp kernelsu.ko "output/kernelsu-lkm-${{ inputs.kmi }}.ko"
          cp kernelsu-manager.apk output/
          cd output && sha256sum * > SHA256SUMS && ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Lava-lxx521-${{ inputs.ksu_version }}-magiskboot
          path: output/
          if-no-files-found: error
