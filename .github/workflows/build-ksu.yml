name: Build KernelSU-Next init_boot (magiskboot)

on:
  workflow_dispatch:
    inputs:
      ksu_version:
        description: "KSU-Next version"
        required: true
        default: "v3.4.1"
      kmi:
        description: "KMI"
        required: true
        default: "android14-6.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify stock image
        run: |
          ls -lh init_boot_stock.img
          C=$(strings -a init_boot_stock.img 2>/dev/null | grep -cE "kernelsu|ksud|u:r:ksu" || echo 0)
          echo "KSU refs in stock: $C"
          if [ "$C" -ge 3 ]; then echo "Already patched"; exit 1; fi

      - name: Extract magiskboot and Download KSU Assets
        run: |
          set -e
          KSU_VER="${{ inputs.ksu_version }}"
          KMI="${{ inputs.kmi }}"
          BASE="https://github.com/KernelSU-Next/KernelSU-Next/releases/download/${KSU_VER}"

          echo ">>> Downloading Official Magisk APK for x86_64 magiskboot..."
          curl -fL --retry 3 -o magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip -o -q magisk.apk "lib/x86_64/libmagiskboot.so"
          mv -f lib/x86_64/libmagiskboot.so magiskboot
          rm -rf lib magisk.apk
          chmod +x magiskboot
          ./magiskboot 2>&1 | head -5

          echo ">>> Downloading kernelsu.ko..."
          curl -fL --retry 3 -o kernelsu.ko "${BASE}/aarch64_${KMI}_kernelsu.ko"

          echo ">>> Downloading Manager APK..."
          APK_NAME=$(curl -s "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/tags/${KSU_VER}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); n=[a['name'] for a in d.get('assets',[]) if a['name'].endswith('-release.apk') and 'spoofed' not in a['name']]; print(n[0] if n else '')" 2>/dev/null || echo "")
          [ -n "$APK_NAME" ] || { echo "APK not found"; exit 1; }
          curl -fL --retry 3 -o kernelsu-manager.apk "${BASE}/${APK_NAME}"

          ls -lh magiskboot kernelsu.ko kernelsu-manager.apk

      - name: Unpack and Patch Ramdisk
        run: |
          set -e
          cp init_boot_stock.img boot.img
          ./magiskboot unpack boot.img

          ./magiskboot cpio ramdisk.cpio "mkdir 0755 lib"
          ./magiskboot cpio ramdisk.cpio "mkdir 0755 lib/modules"
          ./magiskboot cpio ramdisk.cpio "add 0644 lib/modules/kernelsu.ko kernelsu.ko"

          cat > init.kernelsu.rc << 'RCEOF'
          on post-fs-data
              insmod /lib/modules/kernelsu.ko
          RCEOF
          ./magiskboot cpio ramdisk.cpio "add 0644 init.kernelsu.rc init.kernelsu.rc"

      - name: Repack and Verify Image
        run: |
          set -e
          mkdir -p output
          ./magiskboot repack boot.img output/init_boot-patched.img
          ls -lh output/

          P="output/init_boot-patched.img"
          [ -f "$P" ] || { echo "No output file"; exit 1; }
          MAGIC=$(head -c 8 "$P" | tr -d '\0')
          echo "Magic: $MAGIC"
          [ "${MAGIC:0:8}" = "ANDROID!" ] || { echo "Bad magic"; exit 1; }
          echo "✅ Output verification passed!"

      - name: Prepare Artifacts
        run: |
          cp init_boot_stock.img output/
          cp kernelsu.ko "output/kernelsu-lkm-${{ inputs.kmi }}.ko"
          cp kernelsu-manager.apk output/
          cd output && sha256sum * > SHA256SUMS && ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Lava-lxx521-${{ inputs.ksu_version }}-patched
          path: output/
          if-no-files-found: error
