name: Build KernelSU-Next init_boot

on:
  workflow_dispatch:
    inputs:
      ksu_version:
        description: "KernelSU-Next version"
        required: true
        default: "v3.4.1"
      kmi:
        description: "KMI version"
        required: true
        default: "android14-6.1"

permissions:
  contents: write

jobs:
  build:
    name: Patch init_boot
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify stock init_boot
        run: |
          ls -lh init_boot_stock.img
          MD5=$(md5sum init_boot_stock.img | awk "{print \$1}")
          echo "MD5: $MD5"
          C=$(strings init_boot_stock.img | grep -cE "kernelsu|ksud|u:r:ksu" 2>/dev/null || true)
          if [ -z "$C" ]; then C=0; fi
          echo "KSU refs: $C"
          if [ "$C" -ge 3 ]; then echo "Input already patched"; exit 1; fi

      - name: Download KernelSU-Next
        run: |
          KSU_VER="${{ inputs.ksu_version }}"
          KMI="${{ inputs.kmi }}"
          curl -fL -o ksud "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/${KSU_VER}/ksud-aarch64-linux-android"
          chmod +x ksud
          curl -fL -o "kernelsu-lkm-${KMI}.ko" "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/${KSU_VER}/aarch64_${KMI}_kernelsu.ko"
          APK_NAME=$(curl -s "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/tags/${KSU_VER}" | grep -oE "\"name\": *\"KernelSU_Next_[^\"]*-release\.apk\"" | grep -v spoofed | head -1 | sed -E "s/.*\"(KernelSU_Next_[^\"]*)\"/\1/")
          echo "APK: $APK_NAME"
          curl -fL -o kernelsu-manager.apk "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/${KSU_VER}/${APK_NAME}"
          ls -lh ksud kernelsu-lkm-*.ko kernelsu-manager.apk

      - name: Patch init_boot
        run: |
          KMI="${{ inputs.kmi }}"
          mkdir -p output
          IN_MD5=$(md5sum init_boot_stock.img | awk "{print \$1}")
          echo "Input MD5: $IN_MD5"
          ./ksud boot-patch -b init_boot_stock.img -m "kernelsu-lkm-${KMI}.ko" --kmi "${KMI}" --partition init_boot -o output --out-name init_boot-patched.img
          ls -lh output/init_boot-patched.img
          OUT_MD5=$(md5sum output/init_boot-patched.img | awk "{print \$1}")
          echo "Output MD5: $OUT_MD5"
          if [ "$IN_MD5" = "$OUT_MD5" ]; then echo "No-op patch"; exit 1; fi

      - name: Verify output
        run: |
          C=$(strings output/init_boot-patched.img | grep -cE "kernelsu|ksud|u:r:ksu" 2>/dev/null || true)
          if [ -z "$C" ]; then C=0; fi
          echo "KSU refs: $C"
          if [ "$C" -lt 3 ]; then echo "Patch failed"; exit 1; fi
          sha256sum output/init_boot-patched.img init_boot_stock.img

      - name: Prepare Release Files
        run: |
          cp init_boot_stock.img output/
          cp kernelsu-manager.apk output/
          cp "kernelsu-lkm-${{ inputs.kmi }}.ko" output/
          cd output
          sha256sum init_boot-patched.img init_boot_stock.img kernelsu-manager.apk kernelsu-lkm-*.ko > SHA256SUMS
          ls -lh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Lava-lxx521-${{ inputs.ksu_version }}
          path: output/
          retention-days: 30
          if-no-files-found: error
