name: Build KernelSU-Next init_boot

on:
  workflow_dispatch:
    inputs:
      ksu_version:
        description: 'KernelSU-Next version (e.g., v3.4.1)'
        required: true
        default: 'v3.4.1'
      kmi:
        description: 'KMI version'
        required: true
        default: 'android14-6.1'

permissions:
  contents: write

jobs:
  build:
    name: Patch init_boot with KernelSU-Next
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify stock init_boot exists
        run: |
          echo "=== init_boot_stock.img ==="
          ls -lh init_boot_stock.img
          MD5=$(md5sum init_boot_stock.img | awk '{print $1}')
          echo "MD5: $MD5"
          C=$(strings init_boot_stock.img | grep -icE "kernelsu|ksud|u:r:ksu" || echo 0)
          echo "KSU refs (should be 0): $C"
          [ "$C" -lt 3 ] || { echo "❌ Input already patched"; exit 1; }

      - name: Download KernelSU-Next
        run: |
          KSU_VER="${{ inputs.ksu_version }}"
          KMI="${{ inputs.kmi }}"

          echo ">>> Downloading ksud..."
          curl -fL -o ksud "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/${KSU_VER}/ksud-aarch64-linux-android"
          chmod +x ksud

          echo ">>> Downloading LKM (${KMI})..."
          curl -fL -o "kernelsu-lkm-${KMI}.ko" "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/${KSU_VER}/aarch64_${KMI}_kernelsu.ko"

          echo ">>> Downloading Manager APK (auto-detect name)..."
          APK_URL=$(curl -s "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/tags/${KSU_VER}" \
            | python3 -c "
import sys,json
d=json.load(sys.stdin)
for a in d['assets']:
    n=a['name']
    if n.endswith('-release.apk') and 'spoofed' not in n:
        print(a['browser_download_url']); break
")
          echo "APK URL: $APK_URL"
          curl -fL -o kernelsu-manager.apk "$APK_URL"

          echo ""
          echo "=== Downloaded ==="
          ls -lh ksud kernelsu-lkm-*.ko kernelsu-manager.apk

      - name: Show ksud boot-patch help
        run: |
          ./ksud boot-patch --help

      - name: Patch init_boot
        run: |
          KMI="${{ inputs.kmi }}"
          mkdir -p output

          IN_MD5=$(md5sum init_boot_stock.img | awk '{print $1}')
          echo "Input  MD5: $IN_MD5"

          echo ""
          echo ">>> Running ksud boot-patch with --partition init_boot..."
          ./ksud boot-patch \
            -b init_boot_stock.img \
            -m "kernelsu-lkm-${KMI}.ko" \
            --kmi "${KMI}" \
            --partition init_boot \
            -o output \
            --out-name init_boot-patched.img

          echo ""
          echo "=== Verify output exists ==="
          ls -lh output/init_boot-patched.img

          OUT_MD5=$(md5sum output/init_boot-patched.img | awk '{print $1}')
          echo "Output MD5: $OUT_MD5"

          if [ "$IN_MD5" = "$OUT_MD5" ]; then
            echo "❌ BUG: output == input — patch was no-op"
            exit 1
          fi
          echo "✅ Output differs from input — patch real"

      - name: Verify output has KernelSU
        run: |
          KSU_COUNT=$(strings output/init_boot-patched.img | grep -icE "kernelsu|ksud|u:r:ksu" || echo 0)
          echo "KSU refs after patch: $KSU_COUNT"
          strings output/init_boot-patched.img | grep -iE "kernelsu|ksud" | head -10
          [ "$KSU_COUNT" -ge 3 ] || { echo "❌ patch failed"; exit 1; }
          echo ""
          echo "=== Final hashes ==="
          sha256sum output/init_boot-patched.img init_boot_stock.img

      - name: Prepare Release Files
        run: |
          cp init_boot_stock.img output/
          cp kernelsu-manager.apk output/
          cp "kernelsu-lkm-${{ inputs.kmi }}.ko" output/
          cd output
          sha256sum init_boot-patched.img init_boot_stock.img kernelsu-manager.apk kernelsu-lkm-*.ko > SHA256SUMS
          cat SHA256SUMS
          ls -lh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Lava-lxx521-${{ inputs.ksu_version }}
          path: output/
          retention-days: 30
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ksu-${{ inputs.ksu_version }}-${{ github.run_number }}
          name: "KernelSU-Next ${{ inputs.ksu_version }} for Lava Play Ultra 5G"
          body: |
            ## KernelSU-Next ${{ inputs.ksu_version }}
            Patched init_boot for Lava Play Ultra 5G (lxx521 / MT6878).
            **KMI:** ${{ inputs.kmi }}
            **KSU version:** ${{ inputs.ksu_version }}
            ### Install
            Flash `init_boot-patched.img` to init_boot_a and init_boot_b.
          files: |
            output/init_boot-patched.img
            output/init_boot_stock.img
            output/kernelsu-manager.apk
            output/SHA256SUMS
          draft: false
          prerelease: false
