name: Patch init_boot.img with KernelSU Next

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify input is REAL stock (no KSU)
        run: |
          [ -f init_boot.img ] || { echo "❌ init_boot.img missing"; exit 1; }
          ls -lh init_boot.img
          SIZE=$(stat -c %s init_boot.img)
          MAGIC=$(head -c 8 init_boot.img | tr -d '\0')
          PRE=$(strings init_boot.img | grep -icE "kernelsu|ksud|u:r:ksu" || echo 0)
          echo "Size: $SIZE | Magic: $MAGIC | KSU refs: $PRE"
          [[ "$MAGIC" == ANDROID!* ]] || { echo "❌ not Android boot"; exit 1; }
          if [ "$PRE" -ge 3 ]; then
            echo "❌ Input already contains KernelSU. Upload REAL stock."
            exit 1
          fi
          echo "Input MD5: $(md5sum init_boot.img | awk '{print $1}')"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev zlib1g-dev liblz4-dev cpio file

      - name: Clone KernelSU Next
        run: |
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git ksu
          cd ksu && echo "Commit: $(git rev-parse HEAD)"

      - name: Build ksud
        run: |
          cd ksu/userspace/ksud
          cargo build --release 2>&1 | tail -20
          ls -la target/release/ksud

      - name: Show ksud boot-patch help
        run: |
          KSUD=./ksu/userspace/ksud/target/release/ksud
          echo "════════ ksud --help ════════"
          $KSUD --help 2>&1 || true
          echo "════════ ksud boot-patch --help ════════"
          $KSUD boot-patch --help 2>&1 || true

      - name: Patch init_boot.img
        run: |
          KSUD=$(pwd)/ksu/userspace/ksud/target/release/ksud
          IN_MD5=$(md5sum init_boot.img | awk '{print $1}')
          echo "Input MD5: $IN_MD5"

          rm -f init_boot_patched.img
          set +e
          SUCCESS=0
          for KMI in "android14-6.1" "android15-6.1" "android14-5.15" "android13-5.15" "6.1" "5.15"; do
            echo ""
            echo "════════ Attempt: KMI=$KMI ════════"
            rm -f init_boot_patched.img
            $KSUD boot-patch --boot init_boot.img --out init_boot_patched.img --kmi "$KMI" 2>&1
            RC=$?
            echo "RC=$RC"

            if [ -s init_boot_patched.img ]; then
              OUT_MD5=$(md5sum init_boot_patched.img | awk '{print $1}')
              if [ "$IN_MD5" != "$OUT_MD5" ]; then
                echo "✅ SUCCESS with KMI=$KMI"
                SUCCESS=1
                break
              else
                echo "⚠️ Output same as input, retrying..."
              fi
            fi
          done
          set -e

          [ "$SUCCESS" = "1" ] || {
            echo "❌ All KMI attempts failed"
            echo "===== init_boot.img header ====="
            xxd init_boot.img | head -20
            exit 1
          }

          OUT_MD5=$(md5sum init_boot_patched.img | awk '{print $1}')
          echo ""
          echo "Input  MD5: $IN_MD5"
          echo "Output MD5: $OUT_MD5"
          ls -lh init_boot.img init_boot_patched.img

      - name: Verify output has KernelSU
        run: |
          KSU_COUNT=$(strings init_boot_patched.img | grep -icE "kernelsu|ksud|u:r:ksu" || echo 0)
          echo "KSU refs after patch: $KSU_COUNT"
          strings init_boot_patched.img | grep -iE "kernelsu|ksud" | head -10
          [ "$KSU_COUNT" -ge 3 ] || { echo "❌ patch failed"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: init_boot-patched-kernelsu
          path: init_boot_patched.img
          if-no-files-found: error
