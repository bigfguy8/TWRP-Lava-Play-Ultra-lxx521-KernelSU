name: Build KernelSU LKM for lxx521

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip openjdk-11-jdk gcc-aarch64-linux-gnu

      - name: Install LLVM 17
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main" | sudo tee /etc/apt/sources.list.d/llvm17.list
          sudo apt-get update
          sudo apt-get install -y clang-17 lld-17 llvm-17

      - name: Clone KernelSU
        run: git clone https://github.com/tiann/KernelSU.git --depth=1

      - name: Clone full kernel source
        run: |
          # ⚠️ এখানে আসল Linux kernel source repo URL বসাতে হবে
          git clone https://github.com/YOUR-KERNEL-SOURCE-REPO.git -b lineage-23.2 kernel-source --depth=1

      - name: Verify kernel source
        run: |
          if [ ! -d kernel-source/arch/arm64/configs ]; then
            echo "❌ এটি সম্পূর্ণ kernel source নয়!"
            ls kernel-source/
            exit 1
          fi
          echo "✅ সম্পূর্ণ kernel source পাওয়া গেছে"
          ls kernel-source/arch/arm64/configs/ | grep -iE 'lxx521|mt6878|k6878' || echo "কোনো মিলে যাওয়া defconfig নেই"

      - name: Link KernelSU into kernel source
        run: ln -sf $GITHUB_WORKSPACE/KernelSU kernel-source/KernelSU

      - name: Build LKM
        working-directory: kernel-source
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=/usr/lib/llvm-17/bin:$PATH
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          DEFCONFIG=$(ls arch/arm64/configs/ | grep -iE 'lxx521|mt6878|k6878' | head -1)
          echo "Using defconfig: $DEFCONFIG"
          make O=out ARCH=arm64 $DEFCONFIG
          scripts/config --file out/.config -e KSU -e KSU_MANUAL_HOOK -d KSU_KPROBES_HOOK
          make O=out ARCH=arm64 -j$(nproc) modules_prepare
          make O=out ARCH=arm64 -j$(nproc) M=KernelSU modules

      - name: Find and verify LKM
        working-directory: kernel-source
        run: |
          KSU_KO=$(find out -name "kernelsu.ko" -type f | head -1)
          [ -z "$KSU_KO" ] && { echo "❌ kernelsu.ko পাওয়া যায়নি!"; exit 1; }
          echo "✅ পাওয়া গেছে: $KSU_KO"
          strings "$KSU_KO" | grep vermagic || true
          mkdir -p $GITHUB_WORKSPACE/output
          cp "$KSU_KO" $GITHUB_WORKSPACE/output/

      - name: Upload LKM artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-lkm-lxx521
          path: output/kernelsu.ko
          if-no-files-found: error
