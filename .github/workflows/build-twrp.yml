name: Build TWRP for lxx521

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Maximize disk
        run: |
          set +e
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/share/swift /opt/az \
                      /usr/local/.ghcup /opt/pipx /usr/share/miniconda \
                      /usr/local/graalvm /usr/local/share/powershell
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          sudo swapoff -a && sudo rm -f /swapfile
          df -h /

      - name: Install deps
        run: |
          set +e
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gawk flex bison build-essential ccache curl git-core git-lfs \
            gnupg gperf lib32ncurses5-dev lib32z1-dev libffi-dev \
            libgl1-mesa-dev libxml2-utils xsltproc zlib1g-dev \
            python3 python3-pip openjdk-11-jdk zip unzip libssl-dev \
            bc libelf-dev lzop rsync schedtool imagemagick \
            android-sdk-libsparse-utils
          git lfs install --skip-repo

      - name: Install repo
        run: |
          set +e
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+rx ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          ~/bin/repo version

      - name: Sync TWRP manifest
        run: |
          set +e
          mkdir -p twrp-tree && cd twrp-tree
          git config --global user.name "GH Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false
          timeout 1800 ~/bin/repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14 --depth=1 --no-clone-bundle
          timeout 3600 ~/bin/repo sync -c -j4 --no-clone-bundle --no-tags \
            --optimized-fetch --prune 2>&1 | tail -10
          [ -f build/envsetup.sh ] && echo "✅ envsetup.sh OK" || { echo "❌ envsetup missing"; exit 1; }
          df -h /

      - name: Clone + patch device tree
        working-directory: ${{ github.workspace }}/twrp-tree
        run: |
          set +e
          git clone --depth=1 \
            https://github.com/fahimfrk/Dimensity7300-Device-Tree-Lava-Play-Ultra \
            device/lava/lxx521
          cd device/lava/lxx521
          git lfs install --local 2>/dev/null
          git lfs pull 2>&1 | tail -2

          echo ""
          echo "════════ BEFORE PATCH ════════"
          echo "--- AndroidProducts.mk ---"
          cat AndroidProducts.mk
          echo "--- twrp_lxx521.mk (PRODUCT_RELEASE_NAME) ---"
          grep PRODUCT_RELEASE_NAME twrp_lxx521.mk 2>/dev/null || echo "not set"

          echo ""
          echo "════════ APPLYING AOSP 14 LUNCH FIX ════════"
          # Fix 1: Clean PRODUCT_RELEASE_NAME
          sed -i '/^PRODUCT_RELEASE_NAME/d' twrp_lxx521.mk
          echo 'PRODUCT_RELEASE_NAME := ap3a' >> twrp_lxx521.mk

          # Fix 2: Replace COMMON_LUNCH_CHOICES with 3-part format
          sed -i '/^COMMON_LUNCH_CHOICES/d' AndroidProducts.mk
          echo 'COMMON_LUNCH_CHOICES := twrp_lxx521-ap3a-eng twrp_lxx521-ap3a-userdebug' >> AndroidProducts.mk

          echo ""
          echo "════════ AFTER PATCH ════════"
          echo "--- AndroidProducts.mk ---"
          cat AndroidProducts.mk
          echo "--- PRODUCT_RELEASE_NAME ---"
          grep PRODUCT_RELEASE_NAME twrp_lxx521.mk

          echo ""
          echo "════════ prebuilt files ════════"
          ls -la prebuilt/
          echo "kernel: $(stat -c %s prebuilt/kernel) bytes"
          echo "ramdisk: $(stat -c %s prebuilt/stock_ramdisk.cpio.lz4) bytes"

      - name: Build TWRP (vendor_boot)
        working-directory: ${{ github.workspace }}/twrp-tree
        run: |
          set +e
          export LC_ALL=C
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 30G
          ccache -z

          source build/envsetup.sh

          echo "════════ Available lunch targets ════════"
          lunch 2>&1 | head -30
          echo ""

          echo "════════ Lunch attempts ════════"
          LUNCHED=0
          for combo in \
            "twrp_lxx521-ap3a-eng" \
            "twrp_lxx521-ap3a-userdebug" \
            "twrp_lxx521-ap3a-user" \
            "twrp_lxx521-trunk_staging-eng"; do
            echo ">>> trying: $combo"
            if lunch "$combo" >/tmp/lunch.log 2>&1; then
              echo "✅ SUCCESS: $combo"
              LUNCHED=1
              break
            else
              tail -5 /tmp/lunch.log | sed 's/^/   /'
            fi
          done

          if [ "$LUNCHED" != "1" ]; then
            echo "❌ All lunch failed"
            echo "--- Full available targets ---"
            lunch 2>&1 | tail -40
            exit 1
          fi

          echo ""
          echo "════════ Building vendor_bootimage ════════"
          echo "(no recovery partition on this device — TWRP goes to vendor_boot)"
          mka vendorbootimage -j4 2>&1 | tail -150
          echo "exit: $?"

          ccache -s

      - name: Collect images
        working-directory: ${{ github.workspace }}/twrp-tree
        run: |
          set +e
          mkdir -p output
          for d in out/target/product/*/; do
            [ -d "$d" ] || continue
            echo ">>> scanning $d"
            find "$d" -maxdepth 1 -type f \( -name "*.img" -o -name "boot.img" \) -exec cp -v {} output/ \;
          done

          echo ""
          echo "════════ Collected ════════"
          ls -lh output/
          for img in output/*.img; do
            [ -f "$img" ] && echo "  $(stat -c %s "$img") bytes  $(basename $img)"
          done

          if [ -z "$(ls -A output/ 2>/dev/null)" ]; then
            echo "❌ No images — showing out/ contents:"
            find out -name "*.img" -type f 2>/dev/null | head -20
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TWRP-lxx521-${{ github.run_number }}
          path: ${{ github.workspace }}/twrp-tree/output/*.img
          if-no-files-found: warn
          retention-days: 30
