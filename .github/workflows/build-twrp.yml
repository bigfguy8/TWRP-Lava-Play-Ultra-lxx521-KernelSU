name: Build TWRP for lxx521

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Maximize disk
        run: |
          set +e
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/share/swift /opt/az \
                      /usr/local/.ghcup /opt/pipx /usr/share/miniconda \
                      /usr/local/graalvm /usr/local/share/powershell
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          sudo swapoff -a
          sudo rm -f /swapfile
          df -h /

      - name: Install deps
        run: |
          set +e
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gawk flex bison build-essential ccache curl git-core git-lfs \
            gnupg gperf lib32ncurses5-dev lib32z1-dev libffi-dev \
            libgl1-mesa-dev libxml2-utils xsltproc zlib1g-dev \
            python3 python3-pip openjdk-11-jdk zip unzip libssl-dev \
            bc libelf-dev lzop rsync schedtool imagemagick \
            android-sdk-libsparse-utils
          git lfs install --skip-repo

      - name: Install repo
        run: |
          set +e
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+rx ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          ~/bin/repo version

      - name: Sync TWRP manifest
        run: |
          set +e
          mkdir -p twrp-tree && cd twrp-tree
          git config --global user.name "GH Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false
          timeout 1800 ~/bin/repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14 --depth=1 --no-clone-bundle
          timeout 3600 ~/bin/repo sync -c -j4 --no-clone-bundle --no-tags \
            --optimized-fetch --prune 2>&1 | tail -15
          [ -f build/envsetup.sh ] && echo "✅ envsetup.sh" || { echo "❌ envsetup missing"; exit 1; }
          df -h /

      - name: Clone device tree (with LFS)
        working-directory: ${{ github.workspace }}/twrp-tree
        run: |
          set +e
          git clone --depth=1 \
            https://github.com/fahimfrk/Dimensity7300-Device-Tree-Lava-Play-Ultra \
            device/lava/lxx521
          cd device/lava/lxx521
          git lfs install --local 2>/dev/null
          git lfs pull 2>&1 | tail -3

          echo ""
          echo "════════ Device tree files ════════"
          ls -la prebuilt/
          echo ""
          echo "════════ kernel size ════════"
          KSZ=$(stat -c %s prebuilt/kernel 2>/dev/null || echo 0)
          echo "kernel: $KSZ bytes"
          if [ "$KSZ" -lt 100000 ]; then
            echo "⚠️ kernel LFS pointer detected"
            file prebuilt/kernel
          else
            echo "✅ kernel real:"
            file prebuilt/kernel
          fi

          echo ""
          echo "════════ ramdisk size ════════"
          RSZ=$(stat -c %s prebuilt/stock_ramdisk.cpio.lz4 2>/dev/null || echo 0)
          echo "ramdisk: $RSZ bytes"
          [ "$RSZ" -lt 1000000 ] && echo "⚠️ ramdisk LFS pointer" || echo "✅ ramdisk real"

          echo ""
          echo "════════ BoardConfig refs ════════"
          grep -iE "TARGET_PREBUILT_KERNEL|BOARD_PREBUILT_VENDOR_RAMDISK|TARGET_NO_KERNEL" BoardConfig.mk

      - name: Build TWRP
        working-directory: ${{ github.workspace }}/twrp-tree
        run: |
          set +e
          export LC_ALL=C
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 30G
          ccache -z

          source build/envsetup.sh
          [ "$?" != "0" ] && { echo "::error::envsetup failed"; exit 1; }

          echo "════════ Lunch ════════"
          LUNCHED=0
          for combo in twrp_lxx521-eng twrp_lxx521-userdebug; do
            echo ">>> $combo"
            if lunch "$combo" >/tmp/lunch.log 2>&1; then
              echo "✅ $combo OK"
              LUNCHED=1
              break
            fi
          done

          [ "$LUNCHED" != "1" ] && { echo "❌ Lunch failed"; tail -30 /tmp/lunch.log; exit 1; }

          echo ""
          echo "════════ Building ════════"
          mka recoveryimage vendor_boot -j4 2>&1 | tail -150
          echo "exit: $?"
          ccache -s

      - name: Collect images
        working-directory: ${{ github.workspace }}/twrp-tree
        run: |
          set +e
          mkdir -p output
          for d in out/target/product/*/; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 1 -type f -name "*.img" -exec cp -v {} output/ \;
          done

          echo ""
          echo "════════ Collected ════════"
          ls -lh output/
          for img in output/*.img; do
            [ -f "$img" ] && echo "  $(stat -c %s "$img") bytes  $img"
          done

          [ -z "$(ls -A output/ 2>/dev/null)" ] && { echo "❌ No images"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TWRP-lxx521-${{ github.run_number }}
          path: ${{ github.workspace }}/twrp-tree/output/*.img
          if-no-files-found: warn
          retention-days: 30
