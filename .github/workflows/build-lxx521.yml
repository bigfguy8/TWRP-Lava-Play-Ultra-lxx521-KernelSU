name: Build for Lava Play Ultra (lxx521)

on:
  workflow_dispatch:
    inputs:
      build_ksu:
        description: "Build KernelSU-Next init_boot?"
        type: boolean
        default: true
      ksu_version:
        description: "KernelSU-Next version"
        type: string
        default: "v3.4.2"
      kmi:
        description: "KMI"
        type: string
        default: "android14-6.1"
      build_twrp:
        description: "Build TWRP vendor_boot?"
        type: boolean
        default: true
      twrp_branch:
        description: "TWRP branch"
        type: string
        default: "twrp-14"

permissions:
  contents: write

jobs:
  ksu:
    name: KernelSU-Next init_boot
    if: ${{ inputs.build_ksu == true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify stock image
        run: |
          set -e
          if [ ! -f "init_boot_stock.img" ]; then
            echo "ERROR: init_boot_stock.img missing"
            exit 1
          fi
          ls -lh init_boot_stock.img
          C=$(strings -a init_boot_stock.img 2>/dev/null | grep -cE "kernelsu|ksud" || true)
          echo "KSU refs in stock: $C"
          if [ "$C" -gt 3 ]; then
            echo "ERROR: Stock image already patched"
            exit 1
          fi
          echo "OK: Stock image clean"

      - name: Download assets
        run: |
          set -e
          KSU_VER="${{ inputs.ksu_version }}"
          KMI="${{ inputs.kmi }}"
          BASE="https://github.com/KernelSU-Next/KernelSU-Next/releases/download/${KSU_VER}"
          curl -fL --retry 3 -o magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip -o -q magisk.apk "lib/x86_64/libmagiskboot.so"
          mv -f lib/x86_64/libmagiskboot.so magiskboot
          rm -rf lib magisk.apk
          chmod +x magiskboot
          curl -fL --retry 3 -o kernelsu.ko "${BASE}/aarch64_${KMI}_kernelsu.ko"
          ls -lh kernelsu.ko
          APK_NAME=$(curl -s "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/tags/${KSU_VER}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((a['name'] for a in d.get('assets',[]) if a['name'].endswith('.apk') and 'spoofed' not in a['name'] and 'debug' not in a['name']), ''))" 2>/dev/null || echo "")
          if [ -n "$APK_NAME" ]; then
            curl -fL --retry 3 -o kernelsu-manager.apk "${BASE}/${APK_NAME}"
            ls -lh kernelsu-manager.apk
          fi

      - name: Patch ramdisk
        run: |
          set -e
          cp init_boot_stock.img boot.img
          ./magiskboot unpack boot.img
          ./magiskboot cpio ramdisk.cpio "extract init.rc init.rc.stock"
          cp init.rc.stock init.rc
          if ! grep -q "import /init.kernelsu.rc" init.rc; then
            echo "" >> init.rc
            echo "# KernelSU-Next import" >> init.rc
            echo "import /init.kernelsu.rc" >> init.rc
          fi
          printf '%s\n' '# KernelSU-Next init integration' 'on post-fs-data' '    insmod /lib/modules/kernelsu.ko' '' 'on boot' '    chmod 0644 /dev/kernelsu' > init.kernelsu.rc
          ./magiskboot cpio ramdisk.cpio "mkdir 0755 lib"
          ./magiskboot cpio ramdisk.cpio "mkdir 0755 lib/modules"
          ./magiskboot cpio ramdisk.cpio "add 0644 lib/modules/kernelsu.ko kernelsu.ko"
          ./magiskboot cpio ramdisk.cpio "add 0644 init.kernelsu.rc init.kernelsu.rc"
          ./magiskboot cpio ramdisk.cpio "add 0750 init.rc init.rc"
          rm -f init.rc init.rc.stock
          ./magiskboot cpio ramdisk.cpio "exists lib/modules/kernelsu.ko"
          ./magiskboot cpio ramdisk.cpio "exists init.kernelsu.rc"
          mkdir -p output
          ./magiskboot repack boot.img output/init_boot-patched.img
          P="output/init_boot-patched.img"
          MAGIC_HEX=$(head -c 8 "$P" | od -An -tx1 | tr -d ' \n')
          if [ "$MAGIC_HEX" != "414e44524f494421" ]; then
            echo "ERROR: Bad magic (got: $MAGIC_HEX)"
            exit 1
          fi
          echo "OK: PATCHED IMAGE VERIFIED"

      - name: Prepare artifacts
        run: |
          set -e
          cp init_boot_stock.img output/ 2>/dev/null || true
          cp kernelsu.ko "output/kernelsu-lkm-${{ inputs.kmi }}.ko" 2>/dev/null || true
          cp kernelsu-manager.apk output/ 2>/dev/null || true
          cd output
          ls -lh
          sha256sum * > SHA256SUMS 2>/dev/null || true
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: KernelSU-lxx521-${{ inputs.ksu_version }}
          path: output/
          if-no-files-found: error
          retention-days: 30

  twrp:
    name: TWRP vendor_boot
    if: ${{ inputs.build_twrp == true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Maximize disk
        run: |
          set +e
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift /opt/az /usr/local/.ghcup /opt/pipx /usr/share/miniconda /usr/local/graalvm /usr/local/share/powershell
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          sudo swapoff -a && sudo rm -f /swapfile
          df -h /

      - name: Install deps
        run: |
          set +e
          sudo apt-get update -qq
          sudo apt-get install -y -qq gawk flex bison build-essential ccache curl git-core git-lfs gnupg gperf lib32ncurses5-dev lib32z1-dev libffi-dev libgl1-mesa-dev libxml2-utils xsltproc zlib1g-dev python3 python3-pip openjdk-11-jdk zip unzip libssl-dev bc libelf-dev lzop rsync schedtool imagemagick android-sdk-libsparse-utils cpio
          git lfs install --skip-repo

      - name: Install repo tool
        run: |
          set +e
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+rx ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          ~/bin/repo version

      - name: Sync TWRP manifest
        run: |
          set +e
          mkdir -p twrp-tree && cd twrp-tree
          git config --global user.name "GH Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false
          TWRP_BRANCH="${{ inputs.twrp_branch }}"
          timeout 1800 ~/bin/repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b "$TWRP_BRANCH" --depth=1 --no-clone-bundle
          timeout 3600 ~/bin/repo sync -c -j4 --no-clone-bundle --no-tags --optimized-fetch --prune 2>&1 | tail -10
          [ -f build/envsetup.sh ] || { echo "envsetup missing"; exit 1; }
          df -h /

      - name: Clone + patch device tree
        working-directory: ${{ github.workspace }}/twrp-tree
        run: |
          set +e
          git clone --depth=1 https://github.com/fahimfrk/Dimensity7300-Device-Tree-Lava-Play-Ultra device/lava/lxx521
          cd device/lava/lxx521
          git lfs install --local 2>/dev/null
          git lfs pull 2>&1 | tail -2
          sed -i "/^PRODUCT_RELEASE_NAME/d" twrp_lxx521.mk
          echo "PRODUCT_RELEASE_NAME := ap3a" >> twrp_lxx521.mk
          sed -i "/^COMMON_LUNCH_CHOICES/d" AndroidProducts.mk
          echo "COMMON_LUNCH_CHOICES := twrp_lxx521-ap3a-eng twrp_lxx521-ap3a-userdebug" >> AndroidProducts.mk
          cat AndroidProducts.mk

      - name: Build TWRP vendor_boot
        working-directory: ${{ github.workspace }}/twrp-tree
        run: |
          set +e
          export LC_ALL=C
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 30G
          ccache -z
          source build/envsetup.sh
          LUNCHED=0
          for combo in "twrp_lxx521-ap3a-eng" "twrp_lxx521-ap3a-userdebug"; do
            if lunch "$combo" >/tmp/lunch.log 2>&1; then
              LUNCHED=1
              break
            fi
          done
          [ "$LUNCHED" = "1" ] || { lunch 2>&1 | tail -40; exit 1; }
          mka vendorbootimage -j4 2>&1 | tail -150
          ccache -s

      - name: Collect TWRP images
        working-directory: ${{ github.workspace }}/twrp-tree
        run: |
          set +e
          mkdir -p output
          FOUND=0
          for d in out/target/product/*/; do
            [ -d "$d" ] || continue
            while IFS= read -r img; do
              cp -v "$img" output/
              FOUND=$((FOUND + 1))
            done < <(find "$d" -maxdepth 1 -type f -name "*.img")
          done
          [ "$FOUND" -gt 0 ] || exit 1
          ls -lh output/
          cd output && sha256sum *.img > SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TWRP-lxx521
          path: |
            ${{ github.workspace }}/twrp-tree/output/*.img
            ${{ github.workspace }}/twrp-tree/output/SHA256SUMS
          if-no-files-found: warn
          retention-days: 30
