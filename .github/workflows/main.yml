name: Build TWRP for Lava Play Ultra (LXX521)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # 1. Free up disk space FIRST
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 6144
          swap-size-mb: 8192
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      # 2. Checkout AFTER maximize (so files are not wiped)
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git-core gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses-dev x11proto-core-dev libx11-dev lib32z-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip ccache repo libssl-dev libncurses-dev \
            libstdc++6 libncurses6 rsync

          sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 1 || true
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 20G
          ccache -z

      # 4. Sync TWRP source
      - name: Sync TWRP source
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14 --depth=1 --git-lfs --no-clone-bundle

          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags \
            --optimized-fetch --prune --current-branch

      # 5. Copy device tree (with verification)
      - name: Copy device tree
        run: |
          echo "=== Files in root ==="
          ls -la

          mkdir -p workspace/device/lava/lxx521

          # Copy everything needed
          cp -a Android.mk AndroidProducts.mk BoardConfig.mk device.mk \
                system.prop twrp_lxx521.mk vendorsetup.sh \
                workspace/device/lava/lxx521/ 2>/dev/null || true

          for d in bootctrl mtk_plpath_utils prebuilt recovery; do
            [ -d "$d" ] && cp -a "$d" workspace/device/lava/lxx521/
          done

          echo "=== Device tree after copy ==="
          ls -la workspace/device/lava/lxx521/
          find workspace/device/lava/lxx521 -type f | head -20

          # Fail early if critical files are missing
          if [ ! -f workspace/device/lava/lxx521/twrp_lxx521.mk ]; then
            echo "ERROR: twrp_lxx521.mk was not copied!"
            exit 1
          fi

      # 6. Build
      - name: Build TWRP
        working-directory: workspace
        run: |
          source build/envsetup.sh

          # Try the formats declared in your AndroidProducts.mk
          lunch twrp_lxx521-ap2a-eng || lunch twrp_lxx521-ap2a-userdebug

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          # This device uses vendor_boot
          mka vendorbootimage recoveryimage bootimage -j$(nproc) || \
          make vendorbootimage recoveryimage bootimage -j$(nproc)

      # 7. Collect images
      - name: Collect images
        working-directory: workspace
        run: |
          mkdir -p output
          find out/ -type f -name "*.img" -exec cp -v {} output/ \;
          echo "=== Generated images ==="
          ls -lah output/ || true

          if [ -z "$(ls -A output/ 2>/dev/null)" ]; then
            echo "No .img files found"
            find out/ -maxdepth 6 -type d | head -50
            exit 1
          fi

      # 8. Upload
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-LXX521-${{ github.run_number }}
          path: workspace/output/*.img
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-out-${{ github.run_number }}
          path: workspace/out/
          retention-days: 3
