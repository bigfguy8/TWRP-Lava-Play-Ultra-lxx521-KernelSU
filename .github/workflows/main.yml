name: Build TWRP for Lava Play Ultra (LXX521)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # 1. Free disk space (jlumbroso action)
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 2. Extra cleanup + /mnt build space setup (70 GB scratch)
      - name: Setup extra build space
        run: |
          set +e
          echo "=== BEFORE ==="
          df -h / /mnt 2>/dev/null

          # Extra cleanups
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/share/mono
          sudo rm -rf /opt/microsoft
          sudo rm -rf /usr/share/java
          sudo rm -rf /usr/local/sdkman

          # Setup /mnt/build (70 GB scratch)
          sudo mkdir -p /mnt/build
          sudo chown -R $USER:$USER /mnt/build
          echo "/mnt/build ready"

          # Cleanup apt cache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /var/cache/apt/archives/*

          echo ""
          echo "=== AFTER ==="
          df -h / /mnt 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile

          echo "=== AFTER ==="
          df -h /

      # 2. Checkout AFTER maximize (so files are not wiped)
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git-core gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses-dev x11proto-core-dev libx11-dev lib32z-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip ccache repo libssl-dev libncurses-dev \
            libstdc++6 libncurses6 rsync

          sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 1 || true
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 20G
          ccache -z

      # 4. Sync TWRP source
      - name: Sync TWRP source
        run: |
          mkdir -p /mnt/build/workspace
          cd /mnt/build/workspace
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14 --depth=1 --git-lfs --no-clone-bundle

          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags \
            --optimized-fetch --prune --current-branch

      # 5. Copy device tree (with verification)
      - name: Copy device tree
        run: |
          echo "=== Files in root ==="
          ls -la

          mkdir -p /mnt/build/workspace/device/lava/lxx521

          # Copy everything needed
          cp -a Android.mk AndroidProducts.mk BoardConfig.mk device.mk \
                system.prop twrp_lxx521.mk vendorsetup.sh \
                /mnt/build//mnt/build/workspace/device/lava/lxx521/ 2>/dev/null || true

          for d in bootctrl mtk_plpath_utils prebuilt recovery; do
            [ -d "$d" ] && cp -a "$d" /mnt/build/workspace/device/lava/lxx521/
          done

          echo "=== Device tree after copy ==="
          ls -la /mnt/build/workspace/device/lava/lxx521/
          find workspace/device/lava/lxx521 -type f | head -20

          # Fail early if critical files are missing
          if [ ! -f /mnt/build/workspace/device/lava/lxx521/twrp_lxx521.mk ]; then
            echo "ERROR: twrp_lxx521.mk was not copied!"
            exit 1
          fi

      # 6. Build
      - name: Build TWRP
        working-directory: /mnt/build/workspace
        run: |
          source build/envsetup.sh

          # Try the formats declared in your AndroidProducts.mk
          lunch twrp_lxx521-ap2a-eng || lunch twrp_lxx521-ap2a-userdebug

          echo ""
          echo "=== DISK SPACE BEFORE BUILD ==="
          df -h / /mnt 2>/dev/null
          echo ""

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          # This device uses vendor_boot
          mka vendorbootimage recoveryimage bootimage -j$(nproc) || \
          make vendorbootimage recoveryimage bootimage -j$(nproc)

      # 7. Collect images
      - name: Collect images
        working-directory: /mnt/build/workspace
        run: |
          mkdir -p output
          find out/ -type f -name "*.img" -exec cp -v {} output/ \;
          echo "=== Generated images ==="
          ls -lah output/ || true

          if [ -z "$(ls -A output/ 2>/dev/null)" ]; then
            echo "No .img files found"
            find out/ -maxdepth 6 -type d | head -50
            exit 1
          fi

      # 8. Upload
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-LXX521-${{ github.run_number }}
          path: /mnt/build/workspace/output/*.img
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-out-${{ github.run_number }}
          path: /mnt/build/workspace/out/
          retention-days: 3
          if-no-files-found: ignore
